<title>学成选择题 · 西综306刷题系统</title>
<style>
/* ====== 设计令牌 ====== */
:root {
  --bg: #f5f2ec;
  --bg2: #ebe6dd;
  --bg3: #e0d9ce;
  --surface: rgba(255,255,255,0.72);
  --surface-solid: #faf8f5;
  --ink: #3a3737;
  --muted: #8c8780;
  --rule: #d8d2c8;
  --accent: #9a8e82;
  --accent2: #b8aa9a;
  --accent-light: #d4c8ba;
  --accent-bg: #ede7df;
  --green: #7d9e7d;
  --green-bg: #e4efe4;
  --green-light: #f0f7f0;
  --red: #b87a7a;
  --red-bg: #f2e8e8;
  --yellow: #c9a96a;
  --yellow-bg: #f5efe0;
  --blue: #7a95b0;
  --blue-bg: #e8eef4;
  --purple: #a08eb0;
  --purple-bg: #efe8f4;
  --font: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 16px rgba(0,0,0,0.05);
  --shadow-hover: 0 4px 24px rgba(0,0,0,0.08);
  --nav-w: 20%;
  --nav-min: 200px;
  --nav-max: 260px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;touch-action:manipulation;overflow:hidden;height:100vh}

/* ====== 布局骨架 ====== */
.app-shell{display:flex;height:100vh;width:100vw;overflow:hidden}

/* 左侧导航栏 */
.sidebar{
  width:var(--nav-w);min-width:var(--nav-min);max-width:var(--nav-max);
  background:var(--surface-solid);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  position:relative;z-index:20;
  transition:transform .3s ease;
}
.sidebar-header{
  padding:1.5rem 1.2rem 1rem;
  border-bottom:1px solid var(--rule);
}
.sidebar-header .logo{
  font-size:1.25rem;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.sidebar-header .logo span{color:var(--accent)}
.sidebar-header .logo-sub{
  font-size:.72rem;color:var(--muted);margin-top:.25rem;
}

.nav-menu{flex:1;overflow-y:auto;padding:.8rem .6rem;list-style:none}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.7rem .9rem;margin-bottom:.3rem;
  border-radius:var(--radius-sm);
  font-size:.88rem;color:var(--muted);
  cursor:pointer;transition:all .2s;
  border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);
}
.nav-item:hover{background:var(--bg2);color:var(--ink)}
.nav-item.active{background:var(--accent-bg);color:var(--ink);font-weight:600}
.nav-item .nav-icon{font-size:1.1rem;width:24px;text-align:center}
.nav-badge{
  margin-left:auto;font-size:.65rem;padding:.15rem .5rem;
  border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:600;
}

.sidebar-footer{
  padding:1rem 1.2rem;border-top:1px solid var(--rule);
  font-size:.75rem;color:var(--muted);
}
.sidebar-footer .user-row{
  display:flex;align-items:center;gap:.6rem;
}
.user-avatar{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;
}

/* 主内容区 */
.main-area{
  flex:1;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);
}
.main-header{
  height:56px;padding:0 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);flex-shrink:0;
}
.main-header h1{font-size:1.05rem;font-weight:700}
.main-header .header-actions{display:flex;gap:.6rem;align-items:center}
.header-btn{
  padding:.35rem .8rem;border-radius:8px;border:1px solid var(--rule);
  background:transparent;font-size:.78rem;color:var(--muted);
  cursor:pointer;font-family:var(--font);min-height:36px;
}
.header-btn:hover{border-color:var(--accent);color:var(--ink)}

.main-scroll{
  flex:1;overflow-y:auto;padding:1.5rem 2rem 3rem;
  -webkit-overflow-scrolling:touch;
}

/* ====== Home Card 通用 ====== */
.home-card{
  background:var(--surface);backdrop-filter:blur(10px);
  border:1px solid var(--rule);border-radius:var(--radius);
  padding:1.2rem 1.4rem;
  transition:box-shadow .3s,transform .2s;
}
.home-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.home-card .card-title{
  font-size:.9rem;font-weight:700;margin-bottom:.6rem;
  display:flex;align-items:center;gap:.4rem;
}
.home-card .card-more{
  margin-left:auto;font-size:.72rem;color:var(--muted);cursor:pointer;
}

/* ====== 首页 — 仪表盘 ====== */
.dash-grid{
  display:grid;gap:1.2rem;
  grid-template-columns:repeat(12,1fr);
}
.dash-w-8{grid-column:span 8}
.dash-w-4{grid-column:span 4}
.dash-w-6{grid-column:span 6}
.dash-w-12{grid-column:span 12}

@media (max-width:900px){
  .dash-w-8,.dash-w-4,.dash-w-6{grid-column:span 12}
}

/* 欢迎横幅 */
.welcome-banner{
  background:linear-gradient(135deg,var(--accent-bg),var(--bg2));
  border-radius:var(--radius);padding:1.4rem 1.6rem;
  margin-bottom:1.2rem;border:1px solid var(--rule);
}
.welcome-banner h2{font-size:1.15rem;margin-bottom:.3rem}
.welcome-banner p{font-size:.85rem;color:var(--muted)}
.welcome-banner .date-tag{
  display:inline-block;margin-top:.5rem;
  padding:.2rem .7rem;border-radius:6px;
  background:var(--surface);font-size:.75rem;color:var(--muted);
}

/* 数据概览卡片 */
.stat-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;
}
.stat-mini{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius-sm);padding:1rem;text-align:center;
}
.stat-mini .sm-num{
  font-size:1.6rem;font-weight:700;color:var(--accent);
}
.stat-mini .sm-label{font-size:.75rem;color:var(--muted);margin-top:.15rem}
.stat-mini .sm-delta{
  font-size:.7rem;margin-top:.2rem;
}
.sm-delta.up{color:var(--green)}
.sm-delta.down{color:var(--red)}

/* 科目进度卡片 */
.subject-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;
}
.subject-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius-sm);padding:1rem;
  cursor:pointer;transition:all .2s;
}
.subject-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.subject-card .sub-name{font-size:.85rem;font-weight:600;margin-bottom:.4rem}
.subject-card .sub-meta{
  display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:.4rem;
}
.sub-progress-wrap{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.sub-progress-fill{height:100%;border-radius:3px;transition:width .5s ease}

/* 今日复习任务 */
.review-list{list-style:none}
.review-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.55rem 0;border-bottom:1px solid var(--rule);
  font-size:.82rem;
}
.review-item:last-child{border-bottom:none}
.review-item .ri-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.review-item .ri-title{flex:1}
.review-item .ri-tag{
  font-size:.65rem;padding:.1rem .4rem;border-radius:4px;font-weight:600;flex-shrink:0;
}
.ri-tag.urgent{background:var(--red-bg);color:var(--red)}
.ri-tag.normal{background:var(--yellow-bg);color:var(--yellow)}
.ri-tag.done{background:var(--green-bg);color:var(--green)}

/* 薄弱知识点 */
.weak-list{list-style:none}
.weak-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.5rem 0;font-size:.82rem;
}
.weak-bar-bg{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;max-width:120px}
.weak-bar-fill{height:100%;border-radius:3px}
.weak-pct{font-size:.72rem;color:var(--muted);min-width:36px;text-align:right}

/* 学习日历热力图 */
.heatmap-row{display:flex;gap:3px;flex-wrap:wrap}
.heatmap-cell{
  width:22px;height:22px;border-radius:4px;
  background:var(--bg2);transition:background .2s;
}

/* ====== 刷题区 — 科目选择 ====== */
.quiz-subject-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;
}
@media (max-width:800px){.quiz-subject-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:500px){.quiz-subject-grid{grid-template-columns:1fr}}

.quiz-sub-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);padding:1.4rem;
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
}
.quiz-sub-card:hover{
  border-color:var(--accent);box-shadow:var(--shadow-hover);transform:translateY(-2px);
}
.quiz-sub-card .qsc-icon{
  font-size:2rem;margin-bottom:.6rem;
}
.quiz-sub-card .qsc-name{font-size:1rem;font-weight:700;margin-bottom:.3rem}
.quiz-sub-card .qsc-desc{font-size:.78rem;color:var(--muted);margin-bottom:.8rem}
.qsc-stats{display:flex;gap:1rem;font-size:.72rem;color:var(--muted)}
.qsc-stats span{display:flex;align-items:center;gap:.2rem}
.qsc-progress{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--bg2);border-radius:0 0 var(--radius) var(--radius);
}
.qsc-progress-fill{height:100%;border-radius:0 0 0 var(--radius);transition:width .5s}

/* 系统/章节列表 */
.system-list{display:none}
.system-list.show{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.system-group{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);margin-bottom:.8rem;overflow:hidden;
}
.system-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.8rem 1.2rem;background:var(--bg2);cursor:pointer;
}
.system-header .sh-name{font-size:.9rem;font-weight:600}
.system-header .sh-toggle{font-size:.8rem;color:var(--muted);transition:transform .2s}
.system-header.open .sh-toggle{transform:rotate(180deg)}
.system-chapters{
  padding:.4rem 1.2rem .8rem;
  display:none;
}
.system-chapters.show{display:block}
.chapter-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:.5rem 0;border-bottom:1px solid var(--rule);
  font-size:.82rem;cursor:pointer;transition:background .15s;
}
.chapter-row:hover{background:var(--bg2);margin:0 -.6rem;padding:.5rem .6rem;border-radius:6px}
.chapter-row:last-child{border-bottom:none}
.ch-row-left{display:flex;align-items:center;gap:.5rem}
.ch-row-right{display:flex;align-items:center;gap:.6rem}
.ch-count{font-size:.72rem;color:var(--muted)}
.ch-btn{
  padding:.2rem .6rem;border-radius:6px;border:1px solid var(--rule);
  background:transparent;font-size:.7rem;color:var(--muted);
  cursor:pointer;font-family:var(--font);
}
.ch-btn:hover{border-color:var(--accent);color:var(--ink)}

/* 刷题界面 */
.quiz-player{display:none}
.quiz-player.show{display:block;animation:fadeIn .3s}

/* ====== 错题本 ====== */
.filter-bar{
  display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;
}
.filter-pill{
  padding:.35rem .9rem;border-radius:20px;border:1px solid var(--rule);
  background:transparent;font-size:.78rem;color:var(--muted);
  cursor:pointer;font-family:var(--font);transition:all .2s;
}
.filter-pill:hover{border-color:var(--accent)}
.filter-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.error-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius-sm);padding:1rem;margin-bottom:.6rem;
  display:flex;align-items:center;gap:1rem;
}
.error-card .ec-icon{font-size:1.4rem}
.error-card .ec-body{flex:1}
.error-card .ec-title{font-size:.85rem;font-weight:600;margin-bottom:.2rem}
.error-card .ec-meta{font-size:.72rem;color:var(--muted)}
.error-card .ec-actions{display:flex;gap:.4rem}
.ec-actions button{
  padding:.3rem .7rem;border-radius:6px;border:1px solid var(--rule);
  background:transparent;font-size:.72rem;cursor:pointer;font-family:var(--font);
}

/* ====== 学习统计 ====== */
.chart-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);padding:1.2rem;margin-bottom:1rem;
}
.chart-card .chart-title{font-size:.9rem;font-weight:700;margin-bottom:1rem}

/* 简单柱状图 */
.simple-bar{display:flex;align-items:flex-end;gap:8px;height:120px;padding-bottom:24px;position:relative}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1}
.bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .5s ease}
.bar-label{font-size:.65rem;color:var(--muted);margin-top:4px;white-space:nowrap}

/* 雷达图占位 */
.radar-placeholder{
  width:200px;height:200px;margin:0 auto;
  border:2px dashed var(--rule);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;color:var(--muted);
}

/* ====== 设置 ====== */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 0;border-bottom:1px solid var(--rule);
}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:.85rem}
.setting-label .sl-desc{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.setting-control{display:flex;align-items:center;gap:.6rem}

/* Toggle Switch */
.toggle{
  width:44px;height:24px;border-radius:12px;
  background:var(--rule);position:relative;cursor:pointer;
  transition:background .2s;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.toggle.on::after{transform:translateX(20px)}

/* ====== 移动端底部导航 ====== */
@media (max-width:768px){
  .sidebar{display:none}
  .main-area{width:100vw}
  .main-scroll{padding:1rem .8rem 5rem}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .subject-grid{grid-template-columns:1fr}
  .quiz-subject-grid{grid-template-columns:1fr}

  .mobile-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface-solid);backdrop-filter:blur(12px);
    border-top:1px solid var(--rule);
    display:flex;justify-content:space-around;
    padding:.4rem 0 .6rem;z-index:100;
  }
  .mobile-nav-item{
    display:flex;flex-direction:column;align-items:center;
    gap:2px;padding:.3rem .8rem;border:none;background:transparent;
    font-family:var(--font);font-size:.65rem;color:var(--muted);
    cursor:pointer;transition:color .2s;
  }
  .mobile-nav-item.active{color:var(--accent);font-weight:600}
  .mobile-nav-item .mni-icon{font-size:1.3rem}
}

@media (min-width:769px){
  .mobile-nav{display:none}
}

/* ====== 通用工具 ====== */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state .es-icon{font-size:3rem;margin-bottom:.5rem;opacity:.5}
.empty-state p{font-size:.85rem}

.tag{
  display:inline-block;padding:.15rem .5rem;border-radius:4px;
  font-size:.65rem;font-weight:600;
}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-yellow{background:var(--yellow-bg);color:var(--yellow)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}

.section-pad{padding-bottom:2rem}

/* 隐藏/显示 */
.panel{display:none}
.panel.active{display:block;animation:fadeIn .25s}

/* ====== 解析卡片 ====== */
.note-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);padding:1.2rem;margin-bottom:.8rem;
}
.note-card .nc-header{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;flex-wrap:wrap}
.note-card .nc-title{font-size:.9rem;font-weight:700}
.note-card .nc-images{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.note-card .nc-thumb{
  width:80px;height:80px;border-radius:6px;border:1px solid var(--rule);
  cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);transition:opacity .2s;
}
.note-card .nc-thumb:hover{opacity:.8}
.note-card .nc-actions{display:flex;gap:.4rem;margin-top:.6rem}
.btn-sm{
  padding:.25rem .6rem;border-radius:6px;border:1px solid var(--rule);
  background:transparent;font-size:.7rem;cursor:pointer;font-family:var(--font);
  transition:all .2s;
}
.btn-sm:hover{border-color:var(--accent)}

/* ====== 复习模式选择器 ====== */
.mode-selector{
  display:flex;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap;
}
.mode-card{
  flex:1;min-width:120px;padding:1rem;border-radius:var(--radius-sm);
  border:2px solid var(--rule);cursor:pointer;transition:all .2s;
  background:var(--surface);text-align:center;
}
.mode-card:hover{border-color:var(--accent2)}
.mode-card.active{border-color:var(--accent);background:var(--accent-bg)}
.mode-card .mc-title{font-size:.85rem;font-weight:700;margin-bottom:.3rem}
.mode-card .mc-nodes{font-size:.72rem;color:var(--muted);margin-bottom:.3rem}
.mode-card .mc-desc{font-size:.7rem;color:var(--muted);line-height:1.4}
.mode-card .mc-badge{
  display:inline-block;margin-top:.3rem;padding:.1rem .5rem;border-radius:4px;
  font-size:.65rem;font-weight:600;
  background:var(--green-bg);color:var(--green);
}

/* ====== 答案解析弹窗 ====== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.4);z-index:200;
  display:none;align-items:center;justify-content:center;
  padding:1rem;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:var(--surface-solid);border-radius:var(--radius);
  border:1px solid var(--rule);max-width:520px;width:100%;
  padding:1.5rem;max-height:80vh;overflow-y:auto;
  box-shadow:0 8px 40px rgba(0,0,0,.15);
}
.modal-box h3{font-size:1rem;margin-bottom:1rem}
.modal-box textarea{
  width:100%;min-height:100px;padding:.6rem;border-radius:8px;
  border:1px solid var(--rule);font-family:var(--font);font-size:.82rem;
  resize:vertical;background:var(--bg);color:var(--ink);
}
.modal-box .upload-area{
  margin-top:.8rem;padding:1.5rem;border:2px dashed var(--rule);
  border-radius:8px;text-align:center;cursor:pointer;transition:border-color .2s;
}
.modal-box .upload-area:hover{border-color:var(--accent)}
.modal-box .upload-area input{display:none}
.modal-box .preview-thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.modal-box .preview-thumbs img{
  width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);
}
.modal-actions{display:flex;gap:.5rem;margin-top:1rem;justify-content:flex-end}
.modal-actions button{
  padding:.5rem 1.2rem;border-radius:8px;border:1px solid var(--rule);
  font-size:.82rem;cursor:pointer;font-family:var(--font);transition:all .2s;
}
.modal-actions .btn-save{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-actions .btn-cancel{background:transparent}

/* ====== 用户切换 ====== */
.user-switch{cursor:pointer;transition:opacity .2s}
.user-switch:hover{opacity:.8}
.user-switch .us-hint{font-size:.65rem;color:var(--accent);margin-top:.1rem}
.user-dropdown{
  position:absolute;bottom:100%;left:1rem;right:1rem;
  background:var(--surface-solid);border:1px solid var(--rule);
  border-radius:var(--radius-sm);padding:.5rem;margin-bottom:.4rem;
  display:none;box-shadow:var(--shadow-hover);z-index:30;
}
.user-dropdown.show{display:block}
.user-dropdown .ud-item{
  display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;
  border-radius:8px;cursor:pointer;font-size:.82rem;transition:background .15s;
  border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);
}
.user-dropdown .ud-item:hover{background:var(--bg2)}
.user-dropdown .ud-item.active{background:var(--accent-bg);font-weight:600}
.user-dropdown .ud-avatar{
  width:28px;height:28px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:.7rem;font-weight:700;
  color:#fff;flex-shrink:0;
}
.user-dropdown .ud-divider{height:1px;background:var(--rule);margin:.3rem 0}
.user-dropdown .ud-add{
  font-size:.75rem;color:var(--accent);padding:.4rem .8rem;
  cursor:pointer;border:none;background:transparent;width:100%;
  text-align:left;font-family:var(--font);
}

/* ========================================================== */
/* === 以下为匹配交互 CSS（来自 preview 文件2） === */
/* ========================================================== */

/* === 题目区域 === */
.quiz-area { position: relative; }
.quiz-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap;
}
.quiz-header .quiz-title {
  font-weight: 700; font-size: 1rem;
}
.quiz-header .quiz-progress {
  font-size: 0.8rem; color: var(--muted);
  white-space: nowrap;
}
.quiz-header .quiz-progress strong { color: var(--ink); }

/* === 进度条 === */
.progress-bar-wrap {
  width: 100%; height: 6px; background: var(--bg2);
  border-radius: 3px; overflow: hidden; margin: 0.5rem 0 1rem;
}
.progress-bar-wrap .progress-fill {
  height: 100%; background: var(--accent); border-radius: 3px;
  transition: width 0.5s ease;
}

/* === 点击式匹配布局 === */
.matching-layout {
  display: grid; grid-template-columns: 1fr; gap: 1rem;
}

/* 选项池 */
.option-pool {
  background: var(--bg); border-radius: var(--radius);
  border: 1px solid var(--rule); padding: 1rem;
}
.option-pool .pool-title {
  font-size: 0.78rem; font-weight: 600; color: var(--muted);
  margin-bottom: 0.6rem; letter-spacing: 0.5px;
}
.pool-items {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.option-item {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0.4rem 0.7rem;
  border-radius: 8px; border: 2px solid var(--rule);
  font-size: 0.8rem; cursor: pointer;
  transition: all 0.15s; user-select: none;
  min-height: 40px;
  background: #fff;
}
.option-item:hover {
  border-color: var(--accent); background: var(--bg2);
}
.option-item:active {
  transform: scale(0.96);
}
.option-item.placed {
  opacity: 0.35;
  border-style: dashed;
  pointer-events: none;
}
.option-item .opt-letter {
  font-weight: 700; color: var(--accent); font-size: 0.78rem;
  flex-shrink: 0;
}
/* 答案揭示后 */
.option-item.correct {
  border-color: var(--green); background: var(--green-bg);
  opacity: 1;
}
.option-item.wrong {
  border-color: var(--red); background: var(--red-bg);
  opacity: 1;
}
.option-item.missed {
  border-color: var(--yellow); background: #f5f0e0;
  opacity: 0.6;
}

/* 分类区 */
.category-area {
  display: flex; flex-direction: column; gap: 0.8rem;
}
.category-card {
  background: var(--bg); border-radius: var(--radius);
  border: 2px solid var(--rule);
  padding: 0.8rem 1rem;
  transition: border-color 0.2s;
}
.category-card.active-target {
  border-color: var(--accent);
  border-style: dashed;
  background: var(--bg2);
}
.category-card.correct-target {
  border-color: var(--green); border-style: solid;
}
.category-card.wrong-target {
  border-color: var(--red); border-style: solid;
}
.category-card .cat-label {
  font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 6px;
}
.category-card .cat-label .q-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 0.7rem; font-weight: 700;
  flex-shrink: 0;
}
.category-card .cat-status {
  margin-left: auto; font-size: 0.72rem; font-weight: 600;
}
.category-card .placed-list {
  min-height: 2.5rem;
  display: flex; flex-wrap: wrap; gap: 5px;
  padding: 0.4rem;
  border-radius: 8px;
  background: rgba(255,255,255,0.5);
  border: 1px dashed var(--rule);
}
.placed-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 0.25rem 0.55rem; border-radius: 6px;
  background: var(--accent-light); font-size: 0.78rem;
  cursor: pointer;
  transition: background 0.15s;
  min-height: 32px;
}
.placed-chip:hover { background: var(--accent2); color: #fff; }
.placed-chip .chip-letter { font-weight: 700; }
.placed-chip .chip-remove {
  font-size: 0.7rem; opacity: 0.6;
  margin-left: 2px;
}
.placed-chip.correct-chip {
  background: var(--green-bg); border: 1px solid var(--green);
}
.placed-chip.wrong-chip {
  background: var(--red-bg); border: 1px solid var(--red);
}
.empty-hint {
  font-size: 0.75rem; color: var(--muted);
  padding: 0.4rem 0.5rem; font-style: italic;
}

/* 操作按钮 */
.action-bar {
  display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap;
}
.btn {
  padding: 0.5rem 1.2rem; border-radius: 8px; border: 1px solid var(--rule);
  font-size: 0.85rem; cursor: pointer; font-family: var(--font);
  transition: all 0.2s; background: var(--surface);
  min-height: 44px;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--bg2); }
.btn-outline { background: transparent; }

/* 答案揭示 */
.answer-reveal {
  margin-top: 1rem; padding: 1rem;
  border-radius: var(--radius); background: var(--bg2);
  border: 1px solid var(--rule);
  display: none;
}
.answer-reveal.show { display: block; }
.answer-reveal .ans-row {
  display: flex; gap: 0.5rem; margin-bottom: 0.3rem;
  font-size: 0.85rem; flex-wrap: wrap;
}
.answer-reveal .ans-row .ans-cat { font-weight: 700; min-width: 120px; }
.answer-reveal .ans-row .ans-vals { color: var(--accent); }
.answer-reveal .ans-note {
  margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted);
  border-top: 1px solid var(--rule); padding-top: 0.5rem;
}
.answer-reveal .score-bar {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 0.8rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
}
.answer-reveal .score-num {
  font-size: 1.5rem; font-weight: 700;
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar (20%) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">📚 <span>学成</span>选择题</div>
      <div class="logo-sub">西综306 · 智能刷题系统</div>
    </div>
    <nav class="nav-menu">
      <button class="nav-item active" data-panel="home" onclick="switchPanel('home')"><span class="nav-icon">🏠</span>首页总览</button>
      <button class="nav-item" data-panel="quiz" onclick="switchPanel('quiz')"><span class="nav-icon">📝</span>刷题练习</button>
      <button class="nav-item" data-panel="wrong" onclick="switchPanel('wrong')"><span class="nav-icon">❌</span>错题本<span class="nav-badge" id="wrongBadge">0</span></button>
      <button class="nav-item" data-panel="stats" onclick="switchPanel('stats')"><span class="nav-icon">📊</span>学习统计</button>
      <button class="nav-item" data-panel="fav" onclick="switchPanel('fav')"><span class="nav-icon">⭐</span>收藏夹</button>
      <button class="nav-item" data-panel="notes" onclick="switchPanel('notes')"><span class="nav-icon">📋</span>我的解析</button>
      <button class="nav-item" data-panel="settings" onclick="switchPanel('settings')"><span class="nav-icon">⚙️</span>设置</button>
    </nav>
    <div class="sidebar-footer" style="position:relative">
      <div class="user-dropdown" id="userDropdown"></div>
      <div class="user-row user-switch" onclick="toggleUserDropdown()">
        <div class="user-avatar" id="currentUserAvatar">R</div>
        <div>
          <div style="font-size:.82rem;font-weight:600;color:var(--ink)" id="currentUserName">Rosy1003</div>
          <div style="font-size:.7rem" id="userStreak">连续打卡 0 天</div>
          <div class="us-hint">点击切换用户 ▾</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Area (80%) -->
  <main class="main-area">
    <header class="main-header">
      <h1 id="pageTitle">首页总览</h1>
      <div class="header-actions">
        <span class="tag tag-yellow" style="font-size:.7rem" id="examCountdown">考研冲刺</span>
        <button class="header-btn" onclick="quickSync()">☁️ 同步</button>
      </div>
    </header>
    <div class="main-scroll">
      <div class="panel active" id="panel-home"><div id="homeContent"></div></div>
      <div class="panel" id="panel-quiz"><div id="quizContent"></div></div>
      <div class="panel" id="panel-wrong"><div id="wrongContent"></div></div>
      <div class="panel" id="panel-stats"><div id="statsContent"></div></div>
      <div class="panel" id="panel-fav"><div id="favContent"></div></div>
      <div class="panel" id="panel-notes"><div id="notesContent"></div></div>
      <div class="panel" id="panel-settings"><div id="settingsContent"></div></div>
    </div>
  </main>
</div>

<!-- Mobile Nav -->
<nav class="mobile-nav">
  <button class="mobile-nav-item active" data-panel="home" onclick="switchPanel('home')"><span class="mni-icon">🏠</span>首页</button>
  <button class="mobile-nav-item" data-panel="quiz" onclick="switchPanel('quiz')"><span class="mni-icon">📝</span>刷题</button>
  <button class="mobile-nav-item" data-panel="wrong" onclick="switchPanel('wrong')"><span class="mni-icon">❌</span>错题</button>
  <button class="mobile-nav-item" data-panel="stats" onclick="switchPanel('stats')"><span class="mni-icon">📊</span>统计</button>
  <button class="mobile-nav-item" data-panel="settings" onclick="switchPanel('settings')"><span class="mni-icon">⚙️</span>设置</button>
</nav>

<!-- Note Modal -->
<div class="modal-overlay" id="noteModal">
  <div class="modal-box">
    <h3>📝 添加答案解析</h3>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:.8rem" id="noteTarget">题目：</div>
    <textarea id="noteText" placeholder="输入你的解析笔记..." style="width:100%;min-height:100px;padding:.6rem;border-radius:8px;border:1px solid var(--rule);font-family:var(--font);font-size:.82rem;resize:vertical;background:var(--bg);color:var(--ink)"></textarea>
    <div class="upload-area" onclick="document.getElementById('noteImageInput').click()" style="margin-top:.8rem;padding:1.5rem;border:2px dashed var(--rule);border-radius:8px;text-align:center;cursor:pointer">
      <div style="font-size:1.5rem;margin-bottom:.3rem">📷</div>
      <div style="font-size:.78rem;color:var(--muted)">点击上传截图（支持多张）</div>
      <input type="file" id="noteImageInput" accept="image/*" multiple style="display:none" onchange="previewNoteImages(event)">
    </div>
    <div class="preview-thumbs" id="noteImagePreview" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem"></div>
    <div class="modal-actions" style="display:flex;gap:.5rem;margin-top:1rem;justify-content:flex-end">
      <button class="btn-cancel" onclick="closeNoteModal()" style="padding:.5rem 1.2rem;border-radius:8px;border:1px solid var(--rule);font-size:.82rem;cursor:pointer;font-family:var(--font);background:transparent">取消</button>
      <button class="btn-save" onclick="saveNote()" style="padding:.5rem 1.2rem;border-radius:8px;border:1px solid var(--accent);font-size:.82rem;cursor:pointer;font-family:var(--font);background:var(--accent);color:#fff">保存解析</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
