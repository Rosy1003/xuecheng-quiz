<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- CACHE_BUST -->
<script>
// Force clear old service worker cache then register new one
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(reg) {
      console.log('[Cache] Unregistering old service worker:', reg.scope);
      reg.unregister();
    });
  });
  caches.keys().then(function(names) {
    names.forEach(function(name) {
      console.log('[Cache] Deleting cache:', name);
      caches.delete(name);
    });
  });
  // Register new service worker after clearing old ones
  window.addEventListener('load', function() {
    setTimeout(function() {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('[SW] Registered:', reg.scope);
      }).catch(function(err) {
        console.log('[SW] Registration failed:', err);
      });
    }, 1000);
  });
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rosy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8A9A82">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon512.png">
<title>Rosy 学习工作台</title>
<style>

:root {
  --bg: #F5F2EE;
  --bg2: #EFEAE4;
  --surface: #FFFFFF;
  --ink: #4A4540;
  --muted: #8A847E;
  --rule: #E0DAD3;
  --accent: #A8B8A0;
  --accent-dark: #8A9A82;
  --accent2: #C9A9A1;
  --accent2-dark: #B89088;
  --morandi-blue: #9DAEC2;
  --morandi-blue-dark: #7E92A8;
  --morandi-yellow: #C4B59C;
  --morandi-yellow-dark: #A89880;
  --morandi-purple: #B0A5C0;
  --morandi-purple-dark: #9085A0;
  --radius: 8px;
  --radius-sm: 6px;
  --radius-card: 12px;
  --radius-full: 999px;
  --shadow-sm: 0 1px 3px rgba(120,110,100,0.06);
  --shadow-md: 0 2px 8px rgba(120,110,100,0.08);
  --shadow-lg: 0 4px 16px rgba(120,110,100,0.10);
  --font-sans: 'Noto Sans SC', -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== Layout ===== */
#app {
  display: flex;
  min-height: 100vh;
}
#navPane {
  width: 20%;
  min-width: 180px;
  max-width: 280px;
  background: linear-gradient(180deg, #E4E8E2, #D8DCD4);
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: width 0.2s, min-width 0.2s;
  overflow: hidden;
}
#mainArea {
  flex: 1;
  padding: 24px 32px;
  overflow-x: hidden;
  max-width: calc(100% - 180px);
}
#app.nav-collapsed #navPane {
  width: 0;
  min-width: 0;
  max-width: 0;
  border-right: none;
}
#app.nav-collapsed #mainArea {
  max-width: 100%;
}

/* ===== Navigation ===== */
.nav-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--rule);
}
.nav-header h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-dark);
  margin-bottom: 4px;
}
.nav-header .nav-sub {
  font-size: 11px;
  color: var(--muted);
}
.nav-list {
  list-style: none;
  padding: 12px 12px;
  flex: 1;
  overflow-y: auto;
}
.nav-item {
  padding: 10px 16px;
  margin-bottom: 4px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  color: var(--muted);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-item:hover {
  background: var(--surface);
  color: var(--ink);
}
.nav-item.active {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}
.nav-item .nav-icon {
  font-size: 16px;
}
.nav-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--rule);
}
#navToggle {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}
#navToggle:hover {
  background: var(--accent);
  color: #fff;
}
#mobileNavBtn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 100;
  width: 40px;
  height: 40px;
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  background: var(--surface);
  cursor: pointer;
  font-size: 18px;
  box-shadow: var(--shadow-md);
}
#navExpandBtn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 100;
  width: 40px;
  height: 40px;
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  background: var(--surface);
  cursor: pointer;
  font-size: 18px;
  box-shadow: var(--shadow-md);
  align-items: center;
  justify-content: center;
}
#app.nav-collapsed #navExpandBtn {
  display: flex;
}

/* ===== Tab Panels ===== */
.tab-panel {
  display: none;
}
.tab-panel.active {
  display: block;
}

/* ===== Home Sub-Tabs ===== */
.home-subtabs {
  display: flex;
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 2px solid var(--rule);
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  box-shadow: 0 2px 8px rgba(120,110,100,0.06);
  margin-bottom: 16px;
  overflow: hidden;
}
.home-subtab {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  color: var(--muted);
  transition: all 0.2s;
  border-bottom: 3px solid transparent;
  user-select: none;
}
.home-subtab:hover {
  color: var(--ink);
  background: var(--bg);
}
.home-subtab.active {
  color: var(--accent-dark);
  font-weight: 600;
  border-bottom-color: var(--accent);
}
.home-subtab-icon {
  display: block;
  font-size: 18px;
  margin-bottom: 4px;
}
.home-subpanel {
  display: none;
}
.home-subpanel.active {
  display: block;
  animation: homePanelFade 0.3s ease;
}
@keyframes homePanelFade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Home Cards ===== */
.home-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.home-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.home-card-header h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.home-date {
  font-size: 12px;
  color: var(--muted);
}
.home-card-footer {
  margin-top: 12px;
  text-align: right;
}
.home-link {
  font-size: 13px;
  color: var(--accent-dark);
  text-decoration: none;
  font-weight: 500;
}
.home-link:hover {
  text-decoration: underline;
}

/* ===== Countdown ===== */
.home-countdown {
  text-align: center;
  padding: 20px 0;
}
.countdown-big {
  font-size: 48px;
  font-weight: 700;
  color: var(--accent-dark);
  line-height: 1;
}
.countdown-label {
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
}

/* ===== Current Learning ===== */
.current-learning {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.learning-tag {
  display: inline-block;
  padding: 4px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  color: #fff;
}
.learning-tag-sm {
  display: inline-block;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  color: var(--ink);
  background: var(--bg2);
  border: 1px solid var(--rule);
}

/* ===== Task Summary ===== */
.task-summary {
  display: flex;
  gap: 16px;
}
.task-stat {
  flex: 1;
  text-align: center;
  padding: 16px 8px;
  background: var(--bg);
  border-radius: var(--radius);
}
.task-stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-dark);
  line-height: 1;
}
.task-stat-label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

/* ===== Coverage ===== */
.coverage-bar {
  width: 100%;
  height: 8px;
  background: var(--bg2);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-bottom: 8px;
}
.coverage-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width 0.3s;
}
.coverage-text {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}
.subject-coverage {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.subj-coverage-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.subj-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.subj-name {
  width: 60px;
  color: var(--ink);
}
.subj-pct {
  width: 70px;
  color: var(--muted);
}
.mini-bar {
  flex: 1;
  height: 6px;
  background: var(--bg2);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.mini-fill {
  height: 100%;
  border-radius: var(--radius-full);
}

/* ===== Status Bar ===== */
.status-bar {
  display: flex;
  gap: 24px;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.status-item {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.status-label {
  font-size: 12px;
  color: var(--muted);
}
.status-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-dark);
  line-height: 1;
}
.status-item.countdown .status-value {
  color: var(--accent2-dark);
}
.status-unit {
  font-size: 12px;
  color: var(--muted);
}
/* ===== Sync Indicator (top bar) ===== */
.sync-status-item {
  margin-left: auto;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--surface-muted, rgba(0,0,0,0.03));
  transition: background 0.2s;
}
.sync-status-item:hover {
  background: var(--surface-hover, rgba(0,0,0,0.06));
}
.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.sync-dot-ok {
  background: #7BAE7F;
  animation: syncPulse 2s ease-in-out infinite;
}
.sync-dot-syncing {
  background: #C4A882;
  animation: syncSpin 0.8s linear infinite;
}
.sync-dot-error {
  background: #C47A7A;
  animation: none;
}
@keyframes syncSpin {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
  100% { transform: scale(1); opacity: 1; }
}
/* ===== Sync Toast (auto-sync notification) ===== */
.sync-toast {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(237,231,240,0.95);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(154,138,168,0.15);
  border-radius: 999px;
  padding: 8px 20px;
  font-size: 12px;
  color: #7a6a88;
  box-shadow: 0 4px 16px rgba(154,138,168,0.15);
  z-index: 10000;
  animation: syncToastSlide 0.3s ease, syncToastFade 0.3s ease 2.2s forwards;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sync-toast .sync-toast-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #7BAE7F;
  flex-shrink: 0;
}
.sync-toast.sync-toast-error .sync-toast-dot {
  background: #C47A7A;
}
@keyframes syncToastSlide {
  from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes syncToastFade {
  to { opacity: 0; transform: translateX(-50%) translateY(-12px); }
}

/* ===== Chip Selectors ===== */
.chip-section {
  margin-bottom: 12px;
}
.chip-label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.chip-list {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip-list-wrap {
  max-height: 80px;
  overflow-y: auto;
}
.chip {
  display: inline-block;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  cursor: pointer;
  border: 1.5px solid var(--rule);
  background: var(--surface);
  color: var(--muted);
  transition: all 0.15s;
  user-select: none;
}
.chip:hover {
  border-color: var(--accent);
  color: var(--ink);
}
.chip.active {
  color: #fff;
  font-weight: 500;
  border-color: transparent;
}
.chip-sm {
  padding: 3px 10px;
  font-size: 12px;
}

/* ===== Teacher Plan ===== */
.tp-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.tp-date {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}
.tp-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.tp-content-full {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink);
  white-space: pre-wrap;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius);
  max-height: 300px;
  overflow-y: auto;
}
.tp-sync-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
}
.tp-empty {
  padding: 24px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
.tp-loading {
  padding: 24px;
  text-align: center;
  color: var(--accent-dark);
  font-size: 13px;
}
.tp-error {
  padding: 12px;
  text-align: center;
  color: var(--accent2-dark);
  font-size: 13px;
  background: #F5E8E5;
  border-radius: var(--radius);
}
.tp-summary {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.6;
}
.date-input {
  padding: 4px 8px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 12px;
}

/* ===== Plan Sections ===== */
.preview-bar {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.preview-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 600;
}
.preview-days {
  display: flex;
  gap: 8px;
}
.preview-day {
  flex: 1;
  text-align: center;
  padding: 10px 4px;
  border-radius: var(--radius);
  background: var(--bg);
  border: 1px solid transparent;
}
.preview-day.today {
  border-color: var(--accent);
}
.preview-day.has-task {
  background: #E8EDE5;
}
.preview-date {
  font-size: 11px;
  color: var(--muted);
}
.preview-count {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-dark);
  margin-top: 4px;
}
.preview-items-toggle {
  font-size: 10px;
  color: var(--accent);
  cursor: pointer;
  margin-top: 4px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: background 0.15s;
}
.preview-items-toggle:hover { background: var(--bg2); }
.preview-items {
  margin-top: 4px;
  border-top: 1px dashed var(--rule);
  padding-top: 4px;
}
.preview-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  padding: 2px 4px;
  border-radius: 3px;
  margin-bottom: 2px;
  background: var(--bg);
}
.preview-item-name {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  margin-right: 4px;
}
.preview-item-int {
  color: var(--morandi-blue-dark, #5A7A8A);
  background: #E0E8F0;
  padding: 1px 4px;
  border-radius: 3px;
  flex-shrink: 0;
  font-size: 9px;
}

/* ===== Mobile: 7-day preview horizontal scroll ===== */
@media (max-width: 768px) {
  .preview-bar { padding: 12px 14px; }
  .preview-label { font-size: 11px; margin-bottom: 8px; }
  .preview-days {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    gap: 6px;
    padding-bottom: 4px;
  }
  .preview-days::-webkit-scrollbar { height: 3px; }
  .preview-days::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }
  .preview-days::-webkit-scrollbar-track { background: transparent; }
  .preview-day {
    flex: 0 0 105px;
    scroll-snap-align: start;
    padding: 8px 6px;
  }
  .preview-date { font-size: 10px; }
  .preview-date-sub { font-size: 8px; }
  .preview-count { font-size: 18px; }
  .preview-items-toggle { font-size: 9px; padding: 2px 4px; }
  .preview-item { font-size: 11px; padding: 3px 4px; }
  .preview-item-name { font-size: 11px; }
  .preview-item-int { font-size: 9px; }
}

.plan-section {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.plan-section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
}
.plan-section-header h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}
.plan-count {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
}
.plan-section-body {
  padding: 16px 20px;
}

/* ===== Add New Form ===== */
.add-new-form {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.form-select {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font-sans);
  background: var(--surface);
  color: var(--ink);
}
.form-input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font-sans);
}
.btn-add, .btn-sm, .btn-done {
  padding: 6px 16px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 12px;
  cursor: pointer;
  background: var(--surface);
  color: var(--ink);
  transition: all 0.15s;
  font-family: var(--font-sans);
}
.btn-sm:hover {
  background: var(--bg2);
}
.tp-nav-btn {
  padding: 4px 10px !important;
  font-size: 14px !important;
  line-height: 1;
  min-width: 32px;
  text-align: center;
}
.btn-add {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-add:hover {
  background: var(--accent-dark);
}
.btn-done {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-done:hover {
  background: var(--accent-dark);
}
.btn-danger {
  color: var(--accent2-dark);
  border-color: var(--accent2);
}
.btn-danger:hover {
  background: var(--accent2);
  color: #fff;
}
.btn-undo {
  background: var(--bg2);
  color: var(--muted);
}
.btn-outline {
  border-style: dashed;
}

/* ===== Lists ===== */
.today-list, .review-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.today-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: var(--radius);
}
.today-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
}
.today-subj {
  font-size: 11px;
  color: var(--muted);
}
.review-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius);
  border-left: 3px solid transparent;
}
.review-item.overdue {
  border-left-color: var(--accent2);
  background: #FBF0EE;
}
.review-item-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.review-item-info {
  flex: 1;
}
.review-item-name {
  font-size: 13px;
  font-weight: 500;
}
.review-item-meta {
  font-size: 11px;
  color: var(--muted);
}
.review-item-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.interval-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
}
.tag-overdue {
  background: var(--accent2);
}
.overdue-badge {
  font-size: 11px;
  color: var(--accent2-dark);
  font-weight: 600;
}
.rolling-group {
  margin-bottom: 12px;
}
.rolling-group-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  font-size: 13px;
  font-weight: 600;
}
.rolling-count {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
}
.rolling-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: var(--radius);
  margin-bottom: 4px;
}
.rolling-item.done {
  opacity: 0.5;
  text-decoration: line-through;
}
.rolling-name {
  flex: 1;
  font-size: 13px;
}
.rolling-diff {
  font-size: 11px;
  color: var(--morandi-yellow-dark);
}
.rolling-last {
  font-size: 11px;
  color: var(--muted);
}
.empty-hint {
  padding: 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* ===== Review Overview ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.home-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.home-stats-grid .stat-mini {
  text-align: center;
  padding: 14px 8px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--rule);
}
.home-stats-grid .stat-mini .stat-num-mini {
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
}
.home-stats-grid .stat-mini .stat-label-mini {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.stat-card {
  text-align: center;
  padding: 16px 8px;
  background: var(--bg);
  border-radius: var(--radius);
}
.stat-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-dark);
}
.stat-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.filter-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.review-group {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.review-group-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
}
.group-subj {
  font-weight: 600;
}
.group-sys {
  color: var(--muted);
}
.group-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
}
.review-group-body {
  padding: 8px 16px;
}
.chapter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
}
.chapter-row:last-child {
  border-bottom: none;
}
.chapter-row.learned .chapter-name {
  color: var(--ink);
}
.chapter-row:not(.learned) .chapter-name {
  color: var(--muted);
}
.chapter-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.chapter-id {
  font-size: 11px;
  color: var(--muted);
  font-family: monospace;
}
.chapter-name {
  font-size: 13px;
}
.high-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  background: var(--accent2);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
}
.chapter-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.diff-stars {
  font-size: 10px;
  color: var(--morandi-yellow);
  letter-spacing: -1px;
}
.review-count {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
}
.review-count .rc-num {
  font-family: 'SF Mono', Consolas, 'Courier New', monospace;
  font-size: 13px;
  font-weight: 700;
}
.review-count.rc-zero {
  background: #F0ECE8;
  color: var(--muted);
}
.review-count.rc-low {
  background: #E8EDE4;
  color: var(--accent-dark);
}
.review-count.rc-mid {
  background: #DFE7DB;
  color: #6B8265;
}
.review-count.rc-high {
  background: #D5E0D0;
  color: #52704B;
}
.last-review {
  font-size: 10px;
  color: var(--muted);
}

/* ===== Calendar ===== */
.cal-nav {
  display: flex;
  gap: 4px;
  align-items: center;
}
.cal-view-switch {
  display: flex;
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 2px;
  margin-right: 4px;
}
.cal-view-switch button {
  padding: 4px 10px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  font-size: 11px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
}
.cal-view-switch button.active {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.cal-sync-btn {
  background: var(--accent) !important;
  color: #fff !important;
  border-color: var(--accent) !important;
}
.cal-sync-btn:hover {
  background: var(--accent-dark) !important;
}
.cal-sync-btn.syncing {
  opacity: 0.6;
  pointer-events: none;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-weekday {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  padding: 8px 0;
}
.cal-day {
  aspect-ratio: 1;
  padding: 4px;
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cal-day:hover {
  background: var(--bg2);
}
.cal-day.empty {
  background: transparent;
  cursor: default;
}
.cal-day.today {
  background: var(--accent);
  color: #fff;
}
.cal-day.has-event {
  border: 1px solid var(--accent);
}
.cal-day-num {
  font-weight: 600;
  margin-bottom: 2px;
}

/* ===== Week View ===== */
.cal-week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-week-day {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 8px 6px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  transition: all 0.15s;
  cursor: pointer;
}
.cal-week-day:hover {
  border-color: var(--accent);
}
.cal-week-day.today {
  border-color: var(--morandi-blue);
  border-width: 2px;
  box-shadow: 0 0 0 2px rgba(157,174,194,0.15);
}
.cal-week-header {
  text-align: center;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
.cal-week-name {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}
.cal-week-day.today .cal-week-name {
  color: var(--morandi-blue-dark);
}
.cal-week-num {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
}
.cal-week-day.today .cal-week-num {
  color: var(--morandi-blue-dark);
}
.cal-week-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.cal-week-event {
  font-size: 10px;
  padding: 3px 5px;
  border-radius: 4px;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cal-week-event.live {
  background: #F0E2E0;
  color: #A86860;
  font-weight: 600;
}
.cal-week-event.new-learn {
  background: #E8EDE4;
  color: var(--accent-dark);
  font-weight: 500;
}
.cal-week-event.consolidation {
  background: #E0E8F0;
  color: var(--morandi-blue-dark);
  font-weight: 500;
}
.cal-week-event.rolling {
  background: #E8E0EE;
  color: #8A7A9A;
  font-weight: 500;
}
.cal-week-empty {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  padding: 8px 0;
  opacity: 0.5;
}
.cal-week-subgroup {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 5px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 10px;
  margin-bottom: 2px;
  transition: background 0.15s;
}
.cal-week-subgroup:hover { background: var(--bg2); }
.cal-sub-arrow {
  font-size: 8px;
  color: var(--muted);
  width: 10px;
  flex-shrink: 0;
}
.cal-sub-label {
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
}
.cal-sub-label.new-learn { background: #E8EDE4; color: var(--accent-dark); }
.cal-sub-label.consolidation { background: #E0E8F0; color: #5A7A8A; }
.cal-sub-label.rolling { background: #E8E0EE; color: #8A7A9A; }
.cal-sub-items {
  margin-left: 14px;
  margin-bottom: 4px;
}
.cal-sub-item {
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 3px;
  margin-bottom: 1px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cal-sub-item.new-learn { background: #F5F8F3; color: var(--text); }
.cal-sub-item.consolidation { background: #F0F4F8; color: var(--text); }
.cal-sub-item.consolidation.done { text-decoration: line-through; color: var(--muted); }
.cal-sub-item.rolling { background: #F4F0F8; color: var(--text); }
.cal-sub-int {
  font-size: 8px;
  color: #5A7A8A;
  background: #E0E8F0;
  padding: 1px 3px;
  border-radius: 2px;
  flex-shrink: 0;
  margin-left: 4px;
}
.completed-list {
  max-height: 300px;
  overflow-y: auto;
}
.cal-legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 10px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  margin-top: 8px;
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--muted);
}
.cal-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.cal-event {
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--accent2);
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 1px;
}
.cal-event.consolidation {
  background: var(--accent);
}
.cal-event.live {
  background: var(--morandi-blue);
}
.today-events {
  margin-top: 12px;
}
.event-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.event-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.event-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: var(--radius);
}
.event-type {
  display: inline-block;
  padding: 1px 8px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
}
.event-item.live .event-type {
  background: var(--morandi-blue);
}
.event-title {
  flex: 1;
  font-size: 13px;
}

/* ===== Skill Management ===== */
.skill-info p {
  margin-bottom: 6px;
  font-size: 13px;
}
.skill-modules {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.skill-module {
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
  border-left: 3px solid var(--accent);
}
.module-icon {
  font-size: 24px;
  margin-bottom: 8px;
}
.module-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}
.module-desc {
  font-size: 12px;
  color: var(--muted);
}
.skill-todos {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.todo-item {
  font-size: 13px;
  padding: 4px 0;
}
.todo-item.done {
  color: var(--accent-dark);
}
.data-actions {
  display: flex;
  gap: 8px;
}


/* ===== Task Plan Tabs ===== */
.task-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border-bottom: 2px solid var(--rule);
}
.task-tab {
  padding: 10px 24px;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  user-select: none;
}
.task-tab:hover {
  color: var(--ink);
}
.task-tab.active {
  color: var(--accent-dark);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.task-tab .tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: var(--radius-full);
  background: var(--bg2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}
.task-tab.active .tab-count {
  background: var(--accent);
  color: #fff;
}
.task-tab-content {
  display: none;
}
.task-tab-content.active {
  display: block;
}

/* ===== Cascading Form ===== */
.cascading-form {
  background: var(--bg2);
  border-radius: var(--radius-card);
  padding: 16px 20px;
  margin-bottom: 16px;
}
.cascading-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.cascading-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}
.cascading-date {
  font-size: 12px;
  color: var(--muted);
}
.cascading-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}
.cascading-field {
  flex: 1;
}
.cascading-label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.cascading-select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font-sans);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.cascading-select:disabled {
  background: var(--bg);
  color: var(--muted);
  cursor: not-allowed;
}
.multi-select-area {
  min-height: 80px;
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 8px;
  background: var(--surface);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.multi-select-area.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
}
.ms-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.ms-tag:hover {
  background: var(--accent-dark);
}
.ms-tag .ms-x {
  font-size: 14px;
  line-height: 1;
}
.cascading-hint {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.btn-batch-add {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: background 0.15s;
}
.btn-batch-add:hover {
  background: var(--accent-dark);
}
.btn-batch-add:disabled {
  background: var(--rule);
  color: var(--muted);
  cursor: not-allowed;
}

/* ===== Todo Extraction Card ===== */
.todo-extract-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.todo-extract-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.todo-extract-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.todo-sync-time {
  font-size: 11px;
  color: var(--muted);
}
.todo-list-extract {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.todo-extract-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius);
}
.todo-extract-check {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1.5px solid var(--rule);
  flex-shrink: 0;
  margin-top: 1px;
  cursor: pointer;
  transition: all 0.15s;
}
.todo-extract-check.done {
  background: var(--accent);
  border-color: var(--accent);
}
.todo-extract-check.done::after {
  content: '\2713';
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
}
.todo-extract-body {
  flex: 1;
  font-size: 13px;
  line-height: 1.6;
}
.todo-extract-body.done {
  color: var(--muted);
  text-decoration: line-through;
}
.todo-tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  margin-right: 6px;
}
.todo-tag-review { background: var(--accent); }
.todo-tag-quiz { background: var(--morandi-blue); }
.todo-tag-live { background: var(--accent2); }
.todo-tag-other { background: var(--morandi-yellow-dark); }

/* ===== Calendar Live Markers ===== */
.cal-day.has-live {
  border: 2px solid var(--accent2);
}
.cal-event-live {
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--accent2);
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 1px;
}

/* ===== Responsive: Tablet (iPad) ===== */
@media (max-width: 1024px) and (min-width: 769px) {
  #navPane {
    width: 180px;
    min-width: 180px;
    max-width: 200px;
  }
  #mainArea {
    padding: 20px 20px;
    max-width: calc(100% - 180px);
  }
  .home-card {
    padding: 16px 18px;
  }
  .stats-grid,
  .home-stats-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .mm-grid,
  .mm-grid-sparse {
    grid-template-columns: repeat(6, 1fr);
  }
}

/* ===== Responsive: Mobile (iPhone / Android) ===== */
@media (max-width: 768px) {
  /* Navigation */
  #navPane {
    position: fixed;
    z-index: 99;
    width: 240px;
    min-width: 240px;
    transform: translateX(-100%);
    transition: transform 0.2s;
  }
  #app.nav-open #navPane {
    transform: translateX(0);
  }
  #app.nav-collapsed:not(.nav-open) #navPane {
    transform: translateX(-100%);
    width: 240px;
    min-width: 240px;
  }
  #navExpandBtn {
    display: none !important;
  }
  #mobileNavBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    font-size: 20px;
    top: env(safe-area-inset-top, 12px);
    left: env(safe-area-inset-left, 12px);
  }
  #mainArea {
    padding: 56px 16px 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    padding-top: calc(56px + env(safe-area-inset-top, 0px));
    max-width: 100%;
  }

  /* Fix 1: Stats grid → 2 columns */
  .stats-grid,
  .home-stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .home-stats-grid .stat-mini {
    padding: 12px 6px;
  }
  .home-stats-grid .stat-mini .stat-num-mini {
    font-size: 22px;
  }

  /* Fix 2: Emotion check-in → 2 columns, allow wrapping */
  .ec-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .ec-tag {
    white-space: normal;
    padding: 12px 8px;
    font-size: 14px;
    min-height: 44px;
  }

  /* Fix 3: Calendar → horizontal scroll */
  .cal-grid {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    grid-template-columns: repeat(7, minmax(48px, 1fr));
    gap: 3px;
  }
  .cal-week-grid {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    grid-template-columns: repeat(7, minmax(80px, 1fr));
    gap: 4px;
    padding-bottom: 4px;
  }
  .cal-week-day {
    min-height: 100px;
  }
  .cal-day {
    min-height: 48px;
    font-size: 11px;
  }

  /* Fix 4: Milestones → 4 columns */
  .mm-grid,
  .mm-grid-sparse {
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .mm-badge {
    width: 40px;
    height: 40px;
    font-size: 11px;
  }
  .mm-label {
    font-size: 10px;
  }

  /* Skill modules → 1 column */
  .skill-modules {
    grid-template-columns: 1fr;
  }

  /* Task summary → stacked */
  .task-summary {
    flex-direction: column;
  }

  /* Task tabs → scrollable */
  .task-tabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-wrap: nowrap;
  }
  .task-tab {
    padding: 10px 16px;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* 4-tab daily plan → scrollable */
  .dp-tabs4 {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .dp-tab4 {
    padding: 8px 10px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Three-panel sticky tabs → scrollable */
  .tp-sticky-bar {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tp-sticky-tab {
    padding: 10px 12px;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Home subtabs → smaller padding */
  .home-subtabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .home-subtab {
    padding: 10px 6px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .home-subtab-icon {
    font-size: 16px;
  }

  /* Home cards → less padding */
  .home-card {
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  /* Countdown → slightly smaller */
  .countdown-big {
    font-size: 36px;
  }

  /* Data actions → stacked */
  .data-actions {
    flex-direction: column;
    gap: 6px;
  }
  .data-actions button {
    width: 100%;
  }

  /* Review group → tighter */
  .review-group-header {
    padding: 8px 12px;
    font-size: 12px;
  }
  .review-group-body {
    padding: 6px 12px;
  }
  .chapter-row {
    padding: 6px 0;
    font-size: 13px;
  }

  /* Progress section → stacked */
  .dp-progress-section {
    flex-direction: column;
    gap: 6px;
  }

  /* Calendar controls → wrap */
  .cal-controls {
    flex-wrap: wrap;
    gap: 4px;
  }
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--rule);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}


/* ===== Three-Panel Sticky Tabs ===== */
.tp-sticky-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 2px solid var(--rule);
  padding: 0 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  margin: -16px -20px 16px -20px;
  border-radius: var(--radius-card) var(--radius-card) 0 0;
}
.tp-sticky-tab {
  flex: 1; padding: 12px 16px; background: none; border: none; cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--muted);
  border-bottom: 3px solid transparent; transition: all 0.2s; font-family: inherit;
  margin-bottom: -2px; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tp-sticky-tab:hover { color: var(--ink); }
.tp-sticky-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); font-weight: 600; background: rgba(168,184,160,0.06); }
.tp-panel { display: none; }
.tp-panel.active { display: block; animation: tpFadeIn 0.2s ease; }
@keyframes tpFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Four-Tab Daily Plan ===== */
.dp-tabs4 { display: flex; gap: 3px; margin-bottom: 12px; background: var(--surface); padding: 3px; border-radius: var(--radius); border: 1px solid var(--rule); }
.dp-tab4 { flex: 1; padding: 7px 8px; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.dp-tab4:hover { color: var(--ink); }
.dp-tab4.active { background: var(--accent); color: #fff; }
.dp-tab4 .c { display: inline-block; background: rgba(255,255,255,0.3); padding: 1px 7px; border-radius: 999px; font-size: 11px; margin-left: 3px; }
.dp-tab4:not(.active) .c { background: var(--bg2); }
.dp-tab4-content { display: none; }
.dp-tab4-content.active { display: block; }

/* ===== Progress Bars ===== */
.dp-progress-section { display: flex; gap: 10px; margin-bottom: 14px; }
.dp-prog-item { flex: 1; }
.dp-prog-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
.dp-prog-bar { height: 5px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.dp-prog-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }
.dp-prog-fill.new { background: var(--accent); }
.dp-prog-fill.con { background: var(--morandi-blue); }
.dp-prog-fill.rol { background: var(--morandi-purple); }

/* ===== Collapsible Groups ===== */
.dp-group { margin-bottom: 10px; }
.dp-group-header { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; padding: 6px 4px; user-select: none; border-radius: var(--radius); transition: background 0.15s; }
.dp-group-header:hover { background: var(--bg2); }
.dp-group-arrow { transition: transform 0.2s; font-size: 10px; width: 14px; text-align: center; }
.dp-group.collapsed .dp-group-arrow { transform: rotate(-90deg); }
.dp-group-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease; max-height: 2000px; opacity: 1; }
.dp-group.collapsed .dp-group-body { max-height: 0; opacity: 0; }
.dp-group-count { font-size: 11px; background: var(--bg2); padding: 1px 8px; border-radius: 999px; margin-left: 4px; }

/* ===== Task item with delete ===== */
.dp-task-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border-radius: var(--radius); margin-bottom: 4px; border: 1px solid var(--rule); transition: all 0.15s; }
.dp-task-item:hover { border-color: var(--accent); }
.dp-task-check { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--rule); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; transition: all 0.15s; }
.dp-task-check.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.dp-task-info { flex: 1; min-width: 0; }
.dp-task-text { font-size: 13px; }
.dp-task-note { font-size: 11px; color: var(--morandi-blue); font-weight: 600; }
.dp-task-item.done .dp-task-text { text-decoration: line-through; color: var(--muted); }
.dp-task-item.done .dp-task-note { color: var(--muted); }
.dp-task-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.dp-task-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
.dp-task-tag.new { background: #E5EDE0; color: var(--accent-dark); }
.dp-task-tag.con { background: #E3E9F0; color: #7A8FA6; }
.dp-task-tag.rol { background: #EDE7F0; color: #9A8AA8; }
/* ===== Task action buttons (edit + delete) ===== */
.dp-task-actions { display: flex; gap: 2px; flex-shrink: 0; }
.dp-task-btn {
  width: 24px; height: 24px;
  border: none; background: none;
  color: var(--muted); font-size: 13px;
  cursor: pointer; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  opacity: 0.65;
}
.dp-task-item:hover .dp-task-btn { opacity: 0.85; }
.dp-task-btn:hover { opacity: 1 !important; background: var(--bg2); color: var(--ink); }
.dp-task-btn.danger:hover { background: #F5E0DE; color: #C4756B; }
/* Mobile: always visible */
@media (max-width: 768px) {
  .dp-task-btn { opacity: 0.7; }
}
/* ===== Inline edit mode ===== */
.dp-edit-wrap {
  display: flex; gap: 6px; flex: 1; align-items: center;
}
.dp-edit-input {
  flex: 1; padding: 6px 10px; font-size: 13px;
  border: 2px solid var(--accent); border-radius: 6px;
  background: var(--surface); color: var(--ink);
  outline: none; font-family: inherit;
  min-width: 0; width: 100%;
  box-sizing: border-box;
}
.dp-edit-save {
  padding: 6px 14px; font-size: 12px; font-weight: 500;
  background: var(--accent); color: #fff; border: none;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.dp-edit-cancel {
  padding: 6px 10px; font-size: 12px;
  background: transparent; color: var(--muted);
  border: 1px solid var(--rule); border-radius: 6px; cursor: pointer;
  white-space: nowrap;
}
/* Mobile: edit mode full-width */
@media (max-width: 768px) {
  .dp-edit-wrap { flex-wrap: wrap; gap: 4px; }
  .dp-edit-input { font-size: 14px; padding: 8px 10px; }
  .dp-edit-save, .dp-edit-cancel { padding: 8px 16px; font-size: 13px; flex: 1; }
  .dp-task-actions { gap: 4px; }
  .dp-task-btn { width: 28px; height: 28px; font-size: 14px; }
}
/* iPad touch targets */
@media (min-width: 769px) and (max-width: 1024px) {
  .dp-task-btn { width: 28px; height: 28px; opacity: 0.7; }
}
/* ===== Custom New Learn Editor ===== */
.dp-custom-editor {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px dashed var(--rule);
  background: var(--bg);
}
.dp-ce-input {
  width: 100%; box-sizing: border-box;
  padding: 8px 10px; font-size: 13px;
  border: 1px solid var(--rule); border-radius: 6px;
  background: var(--surface); color: var(--ink);
  outline: none; font-family: inherit;
  margin-bottom: 6px;
}
.dp-ce-input:focus { border-color: var(--accent); }
.dp-ce-row {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.dp-ce-select {
  padding: 4px 8px; font-size: 12px;
  border: 1px solid var(--rule); border-radius: 6px;
  background: var(--surface); color: var(--ink);
  font-family: inherit; outline: none;
}
.dp-ce-toggle {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--muted);
  cursor: pointer; user-select: none;
}
.dp-ce-switch {
  width: 32px; height: 18px; border-radius: 9px;
  background: var(--rule); position: relative;
  transition: background 0.15s;
}
.dp-ce-switch.on { background: var(--accent); }
.dp-ce-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; transition: left 0.15s;
}
.dp-ce-switch.on::after { left: 16px; }
.dp-ce-btn {
  margin-left: auto;
  padding: 6px 16px; font-size: 12px; font-weight: 500;
  background: var(--accent); color: #fff; border: none;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.dp-ce-btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* Mobile: editor full-width */
@media (max-width: 768px) {
  .dp-ce-input { font-size: 14px; }
  .dp-ce-row { flex-wrap: wrap; }
  .dp-ce-btn { padding: 8px 20px; font-size: 13px; }
}
/* ===== Custom confirm modal ===== */
.dp-confirm-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.2); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dp-confirm-box {
  background: var(--surface); border-radius: 14px;
  padding: 24px 28px; max-width: 340px; width: 90%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  text-align: center;
}
.dp-confirm-icon { font-size: 32px; margin-bottom: 8px; display: block; }
.dp-confirm-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.dp-confirm-desc { font-size: 12px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
.dp-confirm-actions { display: flex; gap: 8px; justify-content: center; }
.dp-confirm-btn {
  padding: 8px 20px; font-size: 13px; font-weight: 500;
  border-radius: 8px; cursor: pointer; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); transition: all 0.12s;
}
.dp-confirm-btn:hover { background: var(--bg2); }
.dp-confirm-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.dp-confirm-btn.primary:hover { opacity: 0.85; }
.dp-confirm-btn.danger { background: #C4756B; border-color: #C4756B; color: #fff; }
.dp-confirm-btn.danger:hover { opacity: 0.85; }

/* ===== Task Completion Toast ===== */

/* ===== Teacher Todo Extraction ===== */
.tp-todo-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--surface); border-radius: var(--radius); margin-bottom: 4px; border: 1px solid var(--rule); }
.tp-todo-check { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--rule); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all 0.15s; }
.tp-todo-check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }

.tp-todo-tag-sel { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--rule); background: var(--bg2); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tp-todo-tag-sel.new { background: #E5EDE0; color: var(--accent-dark); border-color: var(--accent); }
.tp-todo-tag-sel.con { background: #E3E9F0; color: #7A8FA6; border-color: var(--morandi-blue); }

}

let store = {};
let calCurrentMonth = new Date();
let taskTab = 'summary';
let taskPanel = 'status';
let teacherTodoItems = [];
let cascadingSubject = '';
let cascadingSystem = '';
let cascadingContents = [];
let extractedTodos = [];
let liveDates = [];

// ===== Store Management =====
function defaultStore() {
  return {
    settings: {
      currentSubject: '\u5185\u79d1\u5b66',
      currentSystem: '\u5faa\u73af\u7cfb\u7edf',
      currentContent: ''
    },
    learnedChapters: [],
    newLearnRecords: [],
    reviewRecords: {},
    rollingStatus: {},
    teacherPlan: { content: '', date: '', syncTime: '' },
    calendarEvents: {},
    customTasks: [],
    collapsedGroups: {},
    copyShown: {},
    copySceneLastDate: {},
    emotionRecords: [],
    motivationInsightDate: '',
    activeTab: 'home',
    homeSubtab: 'morning',
    navCollapsed: false,
    syncCode: '',
    lastSyncAt: '',
    lastPullAt: ''
  };
}

function loadStore() {
  try {
    const saved = localStorage.getItem('rosy_store_v3');
    if (saved) {
      const parsed = JSON.parse(saved);
      store = Object.assign(defaultStore(), parsed);
      store.settings = Object.assign(defaultStore().settings, store.settings || {});
    } else {
      store = defaultStore();
    }
  } catch(e) {
    console.error('loadStore error:', e);
    store = defaultStore();
  }
}

// ===== Ebbinghaus Data Migration =====
// Old intervals: [0, 2, 4, 7, 15, 30] (6 nodes, D0 auto-completed)
//   Index 0: D0 (watch recording, same day)
//   Index 1: D2 (exercises, +2 days)
//   Index 2: D4 (mind map, +4 days)
//   Index 3: D7 (review, +7 days)
//   Index 4: D15 (strengthen, +15 days)
//   Index 5: D30 (review, +30 days)
// New intervals: [1, 3, 6, 14, 29] (5 nodes, D1 manual)
//   Index 0: D2 (exercises, +1 day)
//   Index 1: D4 (mind map, +3 days)
//   Index 2: D7 (review, +6 days)
//   Index 3: D15 (strengthen, +14 days)
//   Index 4: D30 (review, +29 days)
// Migration: old index 0 (D0) -> remove; old index N -> new index N-1
function migrateEbReviews() {
  if (store.ebMigrationV2) return; // Already migrated
  var migrated = 0;
  (store.newLearnRecords || []).forEach(function(record) {
    if (!record.completedReviews || record.completedReviews.length === 0) return;
    var oldArr = record.completedReviews;
    var newArr = oldArr.map(function(idx) {
      if (idx === 0) return -1; // Remove old D0
      return idx - 1; // Shift down: old D2(1)->new D2(0), old D4(2)->new D4(1), etc.
    }).filter(function(idx) { return idx >= 0; });
    if (newArr.length !== oldArr.length || newArr.some(function(v, i) { return v !== oldArr[i]; })) {
      record.completedReviews = newArr;
      migrated++;
    }
    // Also migrate skippedReviews
    if (record.skippedReviews && record.skippedReviews.length > 0) {
      var oldSkip = record.skippedReviews;
      var newSkip = oldSkip.map(function(idx) {
        if (idx === 0) return -1;
        return idx - 1;
      }).filter(function(idx) { return idx >= 0; });
      record.skippedReviews = newSkip;
    }
  });
  store.ebMigrationV2 = true;
  if (migrated > 0) {
    console.log('[Migration] Migrated ' + migrated + ' records from old Ebbinghaus indices');
    saveStore();
  }
}

function saveStore() {
  try {
    localStorage.setItem('rosy_store_v3', JSON.stringify(store));
  } catch(e) {
    console.error('saveStore error:', e);
  }
  // Auto-push to cloud if synced (debounced)
  if (store.syncCode) {
    scheduleSyncPush();
  }
}

// Debounced sync push
var syncPushTimer = null;
var _pendingPushRetry = 0;
function scheduleSyncPush() {
  if (syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(function() {
    if (_syncBusy) {
      // Sync in progress - retry after 2 seconds (max 5 retries)
      if (_pendingPushRetry < 5) {
        _pendingPushRetry++;
        console.log('[Sync] Busy, retrying push (' + _pendingPushRetry + '/5)');
        scheduleSyncPush();
      } else {
        _pendingPushRetry = 0;
        console.log('[Sync] Max retries reached, giving up (safety net will catch up)');
      }
    } else {
      _pendingPushRetry = 0;
      syncPushData(false); // silent push
    }
  }, 3000); // 3 second debounce
}

// ===== Helper Functions =====
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function parseDate(str) {
  if (!str) return new Date();
  const parts = str.split('-');
  return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
}

function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function getSubjectSystems(subject) {
  const systems = [];
  CHAPTER_DATA.forEach(function(ch) {
    if (ch.subject === subject && systems.indexOf(ch.system) === -1) {
      systems.push(ch.system);
    }
  });
  return systems;
}

function getSystemContents(subject, system) {
  return CHAPTER_DATA.filter(function(ch) {
    return ch.subject === subject && ch.system === system;
  });
}

function getChapterById(id) {
  var numId = typeof id === 'string' ? parseInt(id, 10) : id;
  return CHAPTER_DATA.find(function(ch) { return ch.id === numId; });
}

// Helper: get display info (name, subject, system) from a newLearnRecord
// Handles both chapter-linked and custom (chapterId=null) records
function getRecordDisplayInfo(record) {
  if (record.chapterId) {
    var ch = getChapterById(record.chapterId);
    if (ch) return { name: ch.name, subject: ch.subject, system: ch.system };
  }
  return {
    name: record.customText || '自定义内容',
    subject: record.subject || '自定义',
    system: ''
  };
}

function isLearned(id) {
  var numId = typeof id === 'string' ? parseInt(id, 10) : id;
  return store.learnedChapters.some(function(lid) {
    var numLid = typeof lid === 'string' ? parseInt(lid, 10) : lid;
    return numLid === numId;
  });
}

function getReviewCount(id) {
  return (store.reviewRecords[id] || {}).count || 0;
}

function getLastReviewDate(id) {
  return (store.reviewRecords[id] || {}).lastDate || '';
}

function getCrossSubjectChapters(system, currentSubject) {
  if (EXCLUDED_SYSTEMS.indexOf(system) >= 0) return [];
  if (Object.keys(CHAPTER_TOPIC_INDEX).length === 0) buildTopicIndex();

  // Determine which chapters to look up
  var selectedName = store.settings.currentContent;
  var lookupChapters;
  if (selectedName) {
    // Specific content selected: only look up that chapter
    lookupChapters = CHAPTER_DATA.filter(function(ch) {
      return ch.subject === currentSubject && ch.system === system && ch.name === selectedName;
    });
  } else {
    // No specific content: look up all chapters in the system
    lookupChapters = CHAPTER_DATA.filter(function(ch) {
      return ch.subject === currentSubject && ch.system === system;
    });
  }

  // Collect all topic group indices for these chapters
  var groupIndices = {};
  lookupChapters.forEach(function(ch) {
    var key = ch.subject + '|' + ch.name;
    var indices = CHAPTER_TOPIC_INDEX[key];
    if (indices) {
      indices.forEach(function(gi) { groupIndices[gi] = true; });
    }
  });

  // Fallback: if specific content has no cross-subject mappings, use system-level lookup
  if (selectedName && Object.keys(groupIndices).length === 0) {
    lookupChapters = CHAPTER_DATA.filter(function(ch) {
      return ch.subject === currentSubject && ch.system === system;
    });
    lookupChapters.forEach(function(ch) {
      var key = ch.subject + '|' + ch.name;
      var indices = CHAPTER_TOPIC_INDEX[key];
      if (indices) {
        indices.forEach(function(gi) { groupIndices[gi] = true; });
      }
    });
  }

  // Collect all chapters from those groups, excluding same subject
  var result = [];
  var seen = {};
  Object.keys(groupIndices).forEach(function(gi) {
    var group = CHAPTER_TOPIC_GROUPS[parseInt(gi)];
    Object.keys(group).forEach(function(key) {
      if (key === currentSubject) return;
      var names = group[key];
      if (Array.isArray(names)) {
        names.forEach(function(n) {
          var found = CHAPTER_DATA.find(function(ch) {
            return ch.subject === key && ch.name === n;
          });
          if (found && !seen[found.id]) {
            seen[found.id] = true;
            var chCopy = Object.assign({}, found);
            if (group._note) {
              chCopy.topicNote = group._note;
            }
            result.push(chCopy);
          }
        });
      }
    });
  });

  return result;
}

// Find directly mapped cross-subject chapters for a given chapter ID
// Returns array of chapter objects (from other subjects in the same topic group)
function getDirectlyMappedChapters(chapterId) {
  var ch = getChapterById(chapterId);
  if (!ch) return [];
  if (EXCLUDED_SYSTEMS.indexOf(ch.system) >= 0) return [];
  if (Object.keys(CHAPTER_TOPIC_INDEX).length === 0) buildTopicIndex();

  var key = ch.subject + '|' + ch.name;
  var indices = CHAPTER_TOPIC_INDEX[key];
  if (!indices) return [];

  var result = [];
  var seen = {};
  indices.forEach(function(gi) {
    var group = CHAPTER_TOPIC_GROUPS[parseInt(gi)];
    Object.keys(group).forEach(function(subj) {
      if (subj === ch.subject || subj === '_note') return;
      var names = group[subj];
      if (Array.isArray(names)) {
        names.forEach(function(n) {
          var found = CHAPTER_DATA.find(function(c) {
            return c.subject === subj && c.name === n;
          });
          if (found && !seen[found.id]) {
            seen[found.id] = true;
            result.push(found);
          }
        });
      }
    });
  });
  return result;
}

// Reset rolling review status for chapters directly mapped to the given chapterId
function resetMappedRollingReviews(chapterId) {
  var mappedChapters = getDirectlyMappedChapters(chapterId);
  mappedChapters.forEach(function(mc) {
    if (store.rollingStatus[mc.id] && store.rollingStatus[mc.id].done) {
      store.rollingStatus[mc.id].done = false;
      // Keep lastDate and reviewRecords for history
    }
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===== Ebbinghaus Review =====
function getConsolidationReviews() {
  const today = new Date();
  const todayStr = fmtDate(today);
  const reviews = [];
  
  store.newLearnRecords.forEach(function(record) {
    EBINGHAUS_INTERVALS.forEach(function(interval, idx) {
      if (record.completedReviews && record.completedReviews.indexOf(idx) >= 0) return;
      if (record.skippedReviews && record.skippedReviews.indexOf(idx) >= 0) return;
      var reviewDate = getShiftedReviewDate(record, idx);
      var reviewDateStr = fmtDate(reviewDate);
      
      // String comparison: only push if review date <= today
      if (reviewDateStr <= todayStr) {
        reviews.push({
          record: record,
          chapterId: record.chapterId,
          interval: interval,
          intervalIdx: idx,
          intervalLabel: EBINGHAUS_LABELS[idx],
          reviewDate: reviewDateStr,
          overdue: reviewDateStr < todayStr,
          overdueDays: reviewDateStr < todayStr ? Math.floor((new Date(todayStr) - new Date(reviewDateStr)) / (1000*60*60*24)) : 0
        });
      }
    });
  });
  
  reviews.sort(function(a, b) {
    if (a.overdue && !b.overdue) return -1;
    if (!a.overdue && b.overdue) return 1;
    return a.reviewDate.localeCompare(b.reviewDate);
  });
  
  return reviews;
}

function getAllConsolidationReviews() {
  var today = new Date();
  var todayStr = fmtDate(today);
  var reviews = [];

  store.newLearnRecords.forEach(function(record) {
    EBINGHAUS_INTERVALS.forEach(function(interval, idx) {
      if (record.skippedReviews && record.skippedReviews.indexOf(idx) >= 0) return;
      var reviewDate = getShiftedReviewDate(record, idx);
      var reviewDateStr = fmtDate(reviewDate);

      if (reviewDateStr <= todayStr) {
        var isDone = record.completedReviews && record.completedReviews.indexOf(idx) >= 0;
        // Hide completed tasks from previous days; keep today's completed for strikethrough
        // Also keep tasks completed today even if overdue (so user can undo)
        if (isDone && reviewDateStr < todayStr) {
          var completionDate = record.completedDates && record.completedDates[idx];
          if (completionDate !== todayStr) return;
        }
        reviews.push({
          record: record,
          chapterId: record.chapterId,
          interval: interval,
          intervalIdx: idx,
          intervalLabel: EBINGHAUS_LABELS[idx],
          reviewDate: reviewDateStr,
          overdue: !isDone && reviewDateStr < todayStr,
          overdueDays: (!isDone && reviewDateStr < todayStr) ? Math.floor((new Date(todayStr) - new Date(reviewDateStr)) / (1000*60*60*24)) : 0,
          isDone: isDone
        });
      }
    });
  });

  reviews.sort(function(a, b) {
    if (a.isDone && !b.isDone) return 1;
    if (!a.isDone && b.isDone) return -1;
    if (a.overdue && !b.overdue) return -1;
    if (!a.overdue && b.overdue) return 1;
    return a.reviewDate.localeCompare(b.reviewDate);
  });

  return reviews;
}

function get7DayPreview() {
  var today = new Date();
  var previews = [];

  for (var i = 0; i < 7; i++) {
    var date = new Date(today);
    date.setDate(date.getDate() + i);
    var dateStr = fmtDate(date);
    var count = 0;
    var items = [];

    store.newLearnRecords.forEach(function(record) {
      EBINGHAUS_INTERVALS.forEach(function(interval, idx) {
        if (record.completedReviews && record.completedReviews.indexOf(idx) >= 0) return;
        if (record.skippedReviews && record.skippedReviews.indexOf(idx) >= 0) return;
        var reviewDate = getShiftedReviewDate(record, idx);
        if (fmtDate(reviewDate) === dateStr) {
          count++;
          var info = getRecordDisplayInfo(record);
          items.push({ name: info.name, subject: info.subject, interval: EBINGHAUS_LABELS[idx] });
        }
      });
    });

    previews.push({
      date: dateStr,
      count: count,
      items: items,
      isToday: i === 0,
      label: i === 0 ? '\u4eca\u5929' : (i === 1 ? '\u660e\u5929' : (i === 2 ? '\u540e\u5929' : (date.getMonth()+1) + '/' + date.getDate())),
      dateLabel: (date.getMonth()+1) + '/' + date.getDate()
    });
  }

  return previews;
}

// ===== Rolling Review =====
function getRollingReviews() {
  if (!store.settings.currentSubject || !store.settings.currentSystem) return [];
  const crossChapters = getCrossSubjectChapters(
    store.settings.currentSystem,
    store.settings.currentSubject
  );
  return crossChapters.filter(function(ch) { return isLearned(ch.id); });
}

        html += '<span class="chip' + (active ? ' active' : '') + '"' + style + ' onclick="onSelectSystem(\'' + s.replace(/'/g, "\\'") + '\')">' + s + '</span>';
      });
      html += '</div></div>';
    }
  }
  
  // Content chips
  if (store.settings.currentSystem) {
    const contents = getSystemContents(store.settings.currentSubject, store.settings.currentSystem);

      html += '<div class="chip-section"><div class="chip-label">\u5f53\u524d\u5185\u5bb9</div><div class="chip-list chip-list-wrap">';

      });

    }
  }
  
  container.innerHTML = html;
}

// --- Helper: pick random element ---
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// --- Dedup engine: scene-level rotation ---
function getCopy(scene) {
  if (!store.copyShown) store.copyShown = {};
  if (!store.copyShown[scene]) store.copyShown[scene] = [];

  var shown = store.copyShown[scene];

  // Generate until we get a new one (max 50 attempts for template-based)
  var text = '';
  var attempts = 0;
  do {
    if (COPY_HANDCRAFT[scene]) {
      // Handcrafted: pick from unshown
      var available = COPY_HANDCRAFT[scene].filter(function(_, idx) { return shown.indexOf(idx) < 0; });
      if (available.length === 0) {
        shown = [];
        store.copyShown[scene] = shown;
        available = COPY_HANDCRAFT[scene];
      }
      var idx = Math.floor(Math.random() * COPY_HANDCRAFT[scene].length);
      if (shown.indexOf(idx) < 0) {
        shown.push(idx);
        text = COPY_HANDCRAFT[scene][idx];
      }
    } else if (SCENE_GENERATORS[scene]) {
      text = SCENE_GENERATORS[scene]();
    } else {
      text = pick(COPY_TASK_TOAST);
    }
    attempts++;
  } while (text && shown.indexOf(text) >= 0 && attempts < 50);

  // For template-based, store the text itself
  if (!COPY_HANDCRAFT[scene]) {
    if (shown.indexOf(text) >= 0) {
      // If all unique combinations exhausted (unlikely), reset
      if (shown.length > 200) {
        store.copyShown[scene] = [text];
      } else {
        shown.push(text);
      }
    } else {
      shown.push(text);
    }
  }

  if (!store.copySceneLastDate) store.copySceneLastDate = {};
  store.copySceneLastDate[scene] = fmtDate(new Date());
  saveStore();
  return text;
}

// --- Scene detection ---
function detectBannerScene() {
  var now = new Date();
  var hour = now.getHours();
  var today = fmtDate(now);

  // Check streak (needs store.newLearnRecords)
  var learnDates = (store.newLearnRecords || []).map(function(r) { return r.date; });
  var uniqueDates = learnDates.filter(function(d, i) { return learnDates.indexOf(d) === i; }).sort();
  var streak = 0;
  if (uniqueDates.length > 0) {
    var d = new Date(today);
    for (var i = uniqueDates.length - 1; i >= 0; i--) {
      var checkDate = fmtDate(d);
      if (uniqueDates.indexOf(checkDate) >= 0) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
  }

  // Streak milestones
  if ([3, 7, 14, 21, 30, 50, 100].indexOf(streak) >= 0) {
    return { scene: 'streak', streak: streak };
  }

  // Low point: no learning in last 2 days
  var yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  var dayBefore = new Date(now);
  dayBefore.setDate(dayBefore.getDate() - 2);
  var yStr = fmtDate(yesterday);
  var dbStr = fmtDate(dayBefore);
  var hasYesterday = uniqueDates.indexOf(yStr) >= 0;
  var hasDayBefore = uniqueDates.indexOf(dbStr) >= 0;
  var hasToday = uniqueDates.indexOf(today) >= 0;
  if (!hasToday && !hasYesterday && !hasDayBefore && uniqueDates.length > 0) {
    return { scene: 'lowpoint' };
  }

  // Morning: 5-12
  if (hour >= 5 && hour < 12) {
    return { scene: 'morning' };
  }
  // Night: 21-5
  if (hour >= 21 || hour < 5) {
    return { scene: 'night' };
  }

  // Default: morning template (afternoon)
  return { scene: 'morning' };
}

// --- Render home banner ---
function renderWarmBanner() {
  var info = detectBannerScene();
  var scene = info.scene;
  var text = getCopy(scene);

  // Scene metadata
  var meta = '';
  var icon = '';
  var badge = '';
  var cssClass = 'warm-banner-default';

  if (scene === 'morning') {
    icon = '\u{1F305}';
    meta = '\u65e9\u5b89 \u00b7 ' + (new Date().getMonth()+1) + '\u6708' + new Date().getDate() + '\u65e5';
    cssClass = 'warm-banner-morning';
  } else if (scene === 'night') {
    icon = '\u{1F319}';
    meta = '\u665a\u5b89 \u00b7 ' + (new Date().getHours()) + ':' + String(new Date().getMinutes()).padStart(2,'0');
    cssClass = 'warm-banner-night';
  } else if (scene === 'lowpoint') {
    icon = '\u{1F917}';
    meta = '\u6b22\u8fce\u56de\u6765';
    cssClass = 'warm-banner-lowpoint';
  } else if (scene === 'milestone') {
    icon = '\u{1F3C6}';
    meta = '\u91cc\u7a0b\u7891\u8fbe\u6210';
    cssClass = 'warm-banner-milestone';
  } else if (scene === 'streak') {
    icon = '\u{1F525}';
    meta = '\u8fde\u7eed\u5b66\u4e60';
    badge = '\u8fde\u7eed ' + info.streak + ' \u5929';
    cssClass = 'warm-banner-streak';
  }

  // Streak badge for non-streak scenes too
  if (scene !== 'streak' && info.streak && info.streak >= 3) {
    badge = '\u8fde\u7eed ' + info.streak + ' \u5929';
  }

  var html = '<div class="warm-banner ' + cssClass + '">';
  // Decorative circles
  html += '<div class="warm-banner-deco" style="top:-10px;right:-10px;width:80px;height:80px;background:' + (scene === 'night' ? '#9daec2' : '#a8b8a0') + ';"></div>';
  html += '<div class="warm-banner-deco" style="bottom:-20px;left:20px;width:60px;height:60px;background:' + (scene === 'night' ? '#7a8fa6' : '#9a8aa8') + ';"></div>';
  html += '<div class="warm-banner-meta">';
  html += '<span style="font-size:18px;">' + icon + '</span>';
  html += '<span class="warm-banner-meta-text">' + meta + '</span>';
  if (badge) {
    var badgeColor = scene === 'night' ? 'rgba(157,174,194,0.2)' : 'rgba(168,184,160,0.15)';
    var badgeText = scene === 'night' ? '#9daec2' : '#5a7d4e';
    html += '<span class="warm-banner-badge" style="background:' + badgeColor + ';color:' + badgeText + ';">' + badge + '</span>';
  }
  html += '</div>';
  html += '<div class="warm-banner-text">' + text.replace(/\n/g, '<br>') + '</div>';
  html += '<div class="warm-banner-footer">';
  html += '<div class="warm-banner-line"></div>';
  html += '<span class="warm-banner-sig">\u2014 Rosy \u5b66\u4e60\u5de5\u4f5c\u53f0</span>';
  html += '</div>';
  html += '</div>';

  return html;
}
