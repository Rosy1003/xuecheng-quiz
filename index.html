function toggleTeacherTodo(idx) {
  if (teacherTodoItems[idx]) {
    teacherTodoItems[idx].checked = !teacherTodoItems[idx].checked;
    renderTeacherTodoPanel();
  }
}

function cycleTodoCategory(idx) {
  if (!teacherTodoItems[idx]) return;
  var cats = ['new', 'con', 'rol'];
  var cur = cats.indexOf(teacherTodoItems[idx].category);
  teacherTodoItems[idx].category = cats[(cur + 1) % cats.length];
  renderTeacherTodoPanel();
}

function setTodoSubject(idx, subject) {
  if (!teacherTodoItems[idx]) return;
  teacherTodoItems[idx].subject = subject;
}

function addSelectedTodos() {
  var selected = teacherTodoItems.filter(function(t) { return t.checked; });
  if (selected.length === 0) {
    alert('请先勾选待办项');
    return;
  }

  var dateInput = document.getElementById('tpDateInput');
  var targetDate = dateInput && dateInput.value ? dateInput.value : fmtDate(new Date());

  // Check for duplicate chapters in 'new' category (check all chapterIds)
  var duplicates = [];
  selected.forEach(function(todo) {
    if (todo.category === 'new') {
      var chIds = todo.chapterIds || (todo.chapterId ? [todo.chapterId] : []);
      chIds.forEach(function(chId) {
        if (isLearned(chId)) {
          var ch = getChapterById(chId);
          if (ch) duplicates.push({ todo: todo, chapter: ch });
        }
      });
    }
  });

  if (duplicates.length > 0) {
    var dupNames = duplicates.map(function(d) {
      return '<span style="color:var(--accent);">' + d.chapter.subject + ' · ' + escapeHtml(d.chapter.name) + '</span>';
    }).join('<br>');
    showConfirmDialog(
      '章节已学过',
      '以下章节已在已学列表中：<br>' + dupNames + '<br><br>是否重新开始复习曲线？<br>确认后将创建新的学习记录，原记录的复习计划不受影响。',
      '确认重新添加',
      false,
      function() { doAddSelectedTodos(selected, targetDate); }
    );
    return;
  }

  doAddSelectedTodos(selected, targetDate);
}

function doAddSelectedTodos(selected, targetDate) {
  var newLearnCount = 0;
  var conCount = 0;
  var rolCount = 0;
  var taskCount = 0;
  var todayStr = fmtDate(new Date());

  selected.forEach(function(todo) {
    // Get chapterIds array (backward compat: use chapterId if chapterIds not set)
    var chIds = todo.chapterIds || (todo.chapterId ? [todo.chapterId] : []);
    var matchMode = todo.matchMode || 'combined';

    if (chIds.length === 0) {
      // Unmatched: create plain customTask
      addCustomTaskForTodo(todo, todayStr);
      taskCount++;
      return;
    }

    if (todo.category === 'new') {
      // New learn: create one newLearnRecord per chapter (each gets own Ebbinghaus curve)
      chIds.forEach(function(chId) {
        var record = {
          id: 'r_' + Date.now() + '_' + chId + '_' + Math.random().toString(36).substr(2, 4),
          chapterId: chId,
          date: todayStr,
          completedReviews: [],
          customText: todo.text
        };
        if (!store.newLearnRecords) store.newLearnRecords = [];
        store.newLearnRecords.push(record);
        var numId = typeof chId === 'string' ? parseInt(chId, 10) : chId;
        if (!isLearned(numId)) store.learnedChapters.push(numId);
        if (!store.reviewRecords[chId]) {
          store.reviewRecords[chId] = { count: 0, lastDate: '', dates: [] };
        }
        store.reviewRecords[chId].count++;
        store.reviewRecords[chId].lastDate = todayStr;
        store.reviewRecords[chId].dates.push(todayStr);
        resetMappedRollingReviews(chId);
        newLearnCount++;
      });
    } else if (todo.category === 'con') {
      // Consolidation: mark due reviews for each chapter
      var totalMarked = 0;
      chIds.forEach(function(chId) {
        var marked = markConsolidationForChapter(chId, todayStr);
        totalMarked += marked;
      });
      if (totalMarked > 0) {
        conCount += totalMarked;
      } else {
        // No due reviews found, create plain customTask
        addCustomTaskForTodo(todo, todayStr);
        taskCount++;
      }
    } else if (todo.category === 'rol') {
      // Rolling review
      if (matchMode === 'combined' && chIds.length > 1) {
        // Combined: ONE task linked to ALL chapters
        if (!store.customTasks) store.customTasks = [];
        var combinedTaskId = 'ct_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        var combinedTask = {
          id: combinedTaskId,
          text: todo.text,
          date: todayStr,
          category: 'rol',
          done: false,
          chapterId: null,
          linkedChapterIds: chIds.slice(),
          partialDone: {}
        };
        store.customTasks.push(combinedTask);
        // Update rollingStatus for each chapter
        chIds.forEach(function(chId) {
          if (!store.rollingStatus[chId]) {
            store.rollingStatus[chId] = { done: false, lastDate: '' };
          }
          store.rollingStatus[chId].customText = todo.text;
          store.rollingStatus[chId].linkedTaskId = combinedTaskId;
          if (!store.reviewRecords[chId]) {
            store.reviewRecords[chId] = { count: 0, lastDate: '', dates: [] };
          }
          var numId = typeof chId === 'string' ? parseInt(chId, 10) : chId;
          if (!isLearned(numId)) store.learnedChapters.push(numId);
          combinedTask.partialDone[chId] = false;
        });
        taskCount++;
        rolCount += chIds.length;
      } else {
        // Separate: one task per chapter
        chIds.forEach(function(chId) {
          var rolTaskId = addCustomTaskForTodo(todo, todayStr, chId);
          taskCount++;
          if (!store.rollingStatus[chId]) {
            store.rollingStatus[chId] = { done: false, lastDate: '' };
          }
          store.rollingStatus[chId].customText = todo.text;
          store.rollingStatus[chId].linkedTaskId = rolTaskId;
          if (!store.reviewRecords[chId]) {
            store.reviewRecords[chId] = { count: 0, lastDate: '', dates: [] };
          }
          var numId = typeof chId === 'string' ? parseInt(chId, 10) : chId;
          if (!isLearned(numId)) store.learnedChapters.push(numId);
          rolCount++;
        });
      }
    } else {
      // Other categories: create plain customTask
      addCustomTaskForTodo(todo, todayStr);
      taskCount++;
    }
  });

  // Uncheck added items
  teacherTodoItems.forEach(function(t) { if (t.checked) t.checked = false; });

  saveStore();
  renderTeacherTodoPanel();
  renderDailyPlan();
  renderHome();

  // Visual feedback
  var hint = document.getElementById('todoAddHint');
  if (!hint) {
    hint = document.createElement('div');
    hint.id = 'todoAddHint';
    hint.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);';
    document.body.appendChild(hint);
  }
  var parts = [];
  if (newLearnCount > 0) parts.push(newLearnCount + '\u4e2a\u65b0\u5b66');
  if (conCount > 0) parts.push(conCount + '\u4e2a\u5de9\u56fa');
  if (rolCount > 0) parts.push(rolCount + '\u4e2a\u6eda\u52a8');
  if (taskCount > 0) parts.push(taskCount + '\u4e2a\u4efb\u52a1');
  hint.textContent = '\u2705 \u5df2\u6dfb\u52a0 ' + parts.join('+') + ' \u5230 ' + todayStr;
  hint.style.display = 'block';
  setTimeout(function() { hint.style.display = 'none'; }, 2500);
}

// Mark all due consolidation review nodes for a chapter as done
function markConsolidationForChapter(chapterId, todayStr) {
  var marked = 0;
  store.newLearnRecords.forEach(function(record) {
    if (record.chapterId !== chapterId) return;
    if (!record.completedReviews) record.completedReviews = [];
    if (record.skippedReviews && record.skippedReviews.indexOf(-1) >= 0) return;

    EBINGHAUS_INTERVALS.forEach(function(interval, idx) {
      if (record.completedReviews.indexOf(idx) >= 0) return;
      if (record.skippedReviews && record.skippedReviews.indexOf(idx) >= 0) return;

      var reviewDate = getShiftedReviewDate(record, idx);
      var reviewDateStr = fmtDate(reviewDate);

      if (reviewDateStr <= todayStr) {
        record.completedReviews.push(idx);
        // Track actual completion date
        if (!record.completedDates) record.completedDates = {};
        record.completedDates[idx] = todayStr;
        // Calculate delay and update shiftDays for subsequent reviews
        if (!record.shiftDeltas) record.shiftDeltas = {};
        var shift = record.shiftDays || 0;
        var delayDays = 0;
        if (todayStr > reviewDateStr) {
          var delayMs = new Date(todayStr) - new Date(reviewDateStr);
          delayDays = Math.floor(delayMs / (1000 * 60 * 60 * 24));
          if (delayDays > 0) {
            record.shiftDays = shift + delayDays;
          }
        }
        record.shiftDeltas[idx] = delayDays;
        record.lastModified = Date.now();
        if (!store.reviewRecords[chapterId]) {
          store.reviewRecords[chapterId] = { count: 0, lastDate: '', dates: [] };
        }
        store.reviewRecords[chapterId].count++;
        store.reviewRecords[chapterId].lastDate = todayStr;
        store.reviewRecords[chapterId].dates.push(todayStr);
        marked++;
      }
    });
  });
  return marked;
}

// Create a plain customTask (without chapterId for proper display)
function addCustomTaskForTodo(todo, targetDate, linkedChapterId) {
  if (!store.customTasks) store.customTasks = [];
  var taskId = 'ct_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  var task = {
    id: taskId,
    text: todo.text,
    date: targetDate,
    category: todo.category,
    done: false,
    chapterId: null
  };
  if (linkedChapterId) task.linkedChapterId = linkedChapterId;
  store.customTasks.push(task);
  return taskId;
}

// ===== Edit custom task (inline) =====
function editCustomTask(taskId) {
  if (!store.customTasks) return;
  var task = store.customTasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  
  var itemEl = document.getElementById('task-' + taskId);
  if (!itemEl) return;
  
  var infoEl = itemEl.querySelector('.dp-task-info');
  if (!infoEl) return;
  
  infoEl.innerHTML = '<div class="dp-edit-wrap"><input class="dp-edit-input" type="text" value="' + escapeHtml(task.text) + '" maxlength="200" /><button class="dp-edit-save" onclick="saveEditTask(\'' + taskId + '\')">\u4fdd\u5b58</button><button class="dp-edit-cancel" onclick="cancelEditTask(\'' + taskId + '\')">\u53d6\u6d88</button></div>';
  
  var input = infoEl.querySelector('.dp-edit-input');
  if (input) {
    input.focus();
    input.select();
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') saveEditTask(taskId);
      if (e.key === 'Escape') cancelEditTask(taskId);
    });
  }
}

function saveEditTask(taskId) {
  if (!store.customTasks) return;
  var itemEl = document.getElementById('task-' + taskId);
  if (!itemEl) return;
  var input = itemEl.querySelector('.dp-edit-input');
  if (!input) return;
  var newText = input.value.trim();
  if (!newText) { cancelEditTask(taskId); return; }
  
  var task = store.customTasks.find(function(t) { return t.id === taskId; });
  if (task) {
    task.text = newText;
    saveStore();
    renderDailyPlan();
  }
}

function cancelEditTask(taskId) {
  renderDailyPlan();
}

// ===== Custom confirm dialog =====
function showConfirmDialog(title, desc, confirmLabel, isDanger, onConfirm) {
  var overlay = document.createElement('div');
  overlay.className = 'dp-confirm-overlay';
  overlay.innerHTML = '<div class="dp-confirm-box"><span class="dp-confirm-icon">' + (isDanger ? '\u26A0' : '\u2753') + '</span><div class="dp-confirm-title">' + title + '</div><div class="dp-confirm-desc">' + desc + '</div><div class="dp-confirm-actions"><button class="dp-confirm-btn" id="confirm-cancel">\u53d6\u6d88</button><button class="dp-confirm-btn ' + (isDanger ? 'danger' : 'primary') + '" id="confirm-ok">' + confirmLabel + '</button></div></div>';
  
  document.body.appendChild(overlay);
  
  document.getElementById('confirm-cancel').addEventListener('click', function() {
    overlay.remove();
  });
  
  document.getElementById('confirm-ok').addEventListener('click', function() {
    overlay.remove();
    if (typeof onConfirm === 'function') onConfirm();
  });
  
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
}

// ===== Delete custom task =====
function deleteCustomTask(taskId) {

    '\u5220\u9664\u4efb\u52a1',
    '\u786e\u8ba4\u5220\u9664\u8fd9\u4e2a\u4efb\u52a1\uff1f<br>\u5220\u9664\u540e\u53ef\u4ece\u5929\u5929\u5e08\u5144\u5f85\u529e\u91cd\u65b0\u6dfb\u52a0\u3002',
    '\u5220\u9664',
    true,
    function() {
      store.customTasks = store.customTasks.filter(function(t) { return t.id !== taskId; });
      saveStore();
      renderDailyPlan();
    }
  );
}

// ===== Toggle custom task done =====
function toggleCustomTaskDone(taskId) {
  if (!store.customTasks) return;
  var task = store.customTasks.find(function(t) { return t.id === taskId; });
  if (!task) return;

  // Handle combined multi-chapter tasks
  if (task.linkedChapterIds && task.linkedChapterIds.length > 1) {
    if (task.done) {
      // Undo all: mark all chapters as not done
      task.linkedChapterIds.forEach(function(chId) {
        if (store.rollingStatus[chId]) {
          store.rollingStatus[chId].done = false;
        }
        if (task.partialDone) task.partialDone[chId] = false;
      });
      task.done = false;
      task.lastModified = Date.now();
      saveStore();
      renderDailyPlan();
      renderHome();
    } else {
      // Show sub-completion dialog
      showMcSubDialog(taskId);
    }
    return;
  }

  // Single-chapter or non-linked task: normal toggle
  task.done = !task.done;
  var justCompleted = task.done;

  // If this is a linked rolling review task, update rollingStatus + reviewRecords
  if (task.linkedChapterId && task.category === 'rol') {
    var chId = task.linkedChapterId;
    if (!store.rollingStatus[chId]) {
      store.rollingStatus[chId] = { done: false, lastDate: '' };
    }
    store.rollingStatus[chId].done = justCompleted;
    if (justCompleted) {
      var todayStr = fmtDate(new Date());
      store.rollingStatus[chId].lastDate = todayStr;
      if (!store.reviewRecords[chId]) {
        store.reviewRecords[chId] = { count: 0, lastDate: '', dates: [] };
      }
      store.reviewRecords[chId].count++;
      store.reviewRecords[chId].lastDate = todayStr;
      store.reviewRecords[chId].dates.push(todayStr);
    }
  }

  task.lastModified = Date.now();
  saveStore();

// ===== Init =====
async function init() {
  await loadChapters();
  loadStore();
  migrateEbReviews();
  
  // Fix: convert string IDs in learnedChapters to numbers (caused by Object.keys in old mergeStoreData)
  if (store.learnedChapters && store.learnedChapters.length > 0) {
    var needsFix = store.learnedChapters.some(function(id) { return typeof id === 'string'; });
    if (needsFix) {
      store.learnedChapters = store.learnedChapters.map(function(id) {
        return typeof id === 'string' ? parseInt(id, 10) : id;
      });
      saveStore();
      console.log('[Migration] learnedChapters: string IDs converted to numbers');
    }
  }
  
  // Fix: correct newLearnRecords dates that were set to plan date instead of actual study date
  // The record ID contains Date.now() timestamp; if its date doesn't match the record.date, fix it
  if (store.newLearnRecords && store.newLearnRecords.length > 0) {
    var dateFixed = 0;
    store.newLearnRecords.forEach(function(record) {
      if (!record.id || record.id.indexOf('r_') !== 0) return;
      var parts = record.id.split('_');
      var ts = parseInt(parts[1], 10);
      if (isNaN(ts)) return;
      var actualDate = fmtDate(new Date(ts));
      if (record.date && record.date !== actualDate) {
        // Record date doesn't match creation time - fix it
        var oldDate = record.date;
        record.date = actualDate;
        dateFixed++;
        // Also fix reviewRecords dates
        var chId = record.chapterId;
        if (store.reviewRecords[chId] && store.reviewRecords[chId].dates) {
          var dates = store.reviewRecords[chId].dates;
          for (var i = 0; i < dates.length; i++) {
            if (dates[i] === oldDate) { dates[i] = actualDate; break; }
          }
          if (store.reviewRecords[chId].lastDate === oldDate) {
            store.reviewRecords[chId].lastDate = actualDate;
          }
        }
      }
    });
    if (dateFixed > 0) {
      saveStore();
      console.log('[Migration] Fixed ' + dateFixed + ' newLearnRecords dates (plan date -> actual date)');
    }
  }
  
  // Fix: correct customTasks dates that were set to plan date instead of actual date
  if (store.customTasks && store.customTasks.length > 0) {
    var taskDateFixed = 0;
    store.customTasks.forEach(function(task) {
      if (!task.id || task.id.indexOf('ct_') !== 0) return;
      var parts = task.id.split('_');
      var ts = parseInt(parts[1], 10);
      if (isNaN(ts)) return;
      var actualDate = fmtDate(new Date(ts));
      if (task.date && task.date !== actualDate) {
        task.date = actualDate;
        taskDateFixed++;
      }
    });
    if (taskDateFixed > 0) {
      saveStore();
      console.log('[Migration] Fixed ' + taskDateFixed + ' customTasks dates (plan date -> actual date)');
    }
  }
  
  // Set default learned chapters on first run
  if (store.learnedChapters.length === 0 && CHAPTER_DATA.length > 0) {
    CHAPTER_DATA.forEach(function(ch) {
      if (['\u751f\u7406\u5b66', '\u75c5\u7406\u5b66', '\u5185\u79d1\u5b66'].indexOf(ch.subject) >= 0) {
        store.learnedChapters.push(ch.id);
      }
    });
    saveStore();
  }
  
  // Apply nav state
  if (store.navCollapsed) {
    const app = document.getElementById('app');
    if (app) app.classList.add('nav-collapsed');
  }
  const navBtn = document.getElementById('navToggle');
  if (navBtn) navBtn.textContent = store.navCollapsed ? '\u5c55\u5f00\u83dc\u5355' : '\u6298\u53e0\u83dc\u5355';
  
  setupMobileNav();
  
  // Set active tab
  const activeTab = store.activeTab || 'home';
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.tab === activeTab);
  });
  document.querySelectorAll('.tab-panel').forEach(function(panel) {
    panel.classList.toggle('active', panel.id === 'panel-' + activeTab);
  });
  renderPanel(activeTab);
  
  // Teacher plan: use stored data (remember last synced date), no auto-sync on load
  // User can manually sync or use prev/next day buttons to switch dates

  // Auto-pull from cloud if syncCode is bound (delayed to not block initial render)
  setupAutoSync();
}

// ===== Auto-sync setup (can be called after binding sync code) =====
var _autoSyncSetup = false;
function setupAutoSync() {
  if (_autoSyncSetup) return; // Only register listeners once
  _autoSyncSetup = true;
  
  // Initial pull after 2 seconds (if syncCode is set)
  setTimeout(function() {
    if (store.syncCode) autoSyncPull();
  }, 2000);
  
  // Periodic auto-pull every 2 minutes
  setInterval(function() {
    if (store.syncCode) autoSyncPull();
  }, 120000);
  
  // Pull when tab becomes visible (switching back from another tab/app)
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && store.syncCode) {
      setTimeout(autoSyncPull, 500);
    }
  });
  
  // Auto-push every 3 minutes as a safety net (catches any unsaved changes)
  setInterval(function() {
    if (store.syncCode && !_syncBusy) {
      syncPushData(false);
    }
  }, 180000);
  
  // Push when page is hidden or closed (use sendBeacon for reliability)
  window.addEventListener('pagehide', function() {
    if (store.syncCode) {
      try {
        var payload = JSON.parse(JSON.stringify(store));
        delete payload.lastPullAt;
        delete payload.lastSyncAt;
        var payloadStr = JSON.stringify({
          action: 'push',
          syncCode: store.syncCode,
          data: payload,
          deviceName: getDeviceName()
        });
        // sendBeacon has a ~64KB limit; fall back to fetch if too large
        if (navigator.sendBeacon && payloadStr.length < 60000) {
          var blob = new Blob([payloadStr], { type: 'application/json' });
          navigator.sendBeacon('/api/sync', blob);
        } else if (navigator.sendBeacon) {
          // Data too large for sendBeacon, use fetch with keepalive
          fetch('/api/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payloadStr,
            keepalive: true
          }).catch(function() {});
        }
      } catch(e) {
        console.log('[Sync] pagehide push failed:', e.message);
      }
    }
  });
}

// ===== Chapter Selection Modal Functions (Multi-Select) =====
var pendingTodoIdx = -1;
var modalSelectedChapterIds = [];
var modalMatchMode = 'combined';
var modalSubjectFilter = '';
var mcSubTaskId = null;
var mcSubCheckedIds = [];

function openChapterModal(todoIdx) {
  pendingTodoIdx = todoIdx;
  modalSelectedChapterIds = [];
  modalMatchMode = 'combined';
  // Allow cross-subject selection - no subject filter
  modalSubjectFilter = '';

  var todo = teacherTodoItems[todoIdx];
  if (todo) {
    // Pre-select existing matches (option A)
    if (todo.chapterIds && todo.chapterIds.length > 0) {
      modalSelectedChapterIds = todo.chapterIds.slice();
      modalMatchMode = todo.matchMode || 'combined';
    } else if (todo.chapterId) {
      modalSelectedChapterIds = [todo.chapterId];
      modalMatchMode = todo.matchMode || 'combined';
    }
  }

  var overlay = document.getElementById('chapterModal');
  if (!overlay) return;
  overlay.classList.add('active');

  var searchInput = document.getElementById('modalSearch');
  if (searchInput) { searchInput.value = ''; searchInput.focus(); }

  var hintEl = document.getElementById('modalSubjHint');
  if (hintEl) hintEl.textContent = '（全部科目，可多选）';

  // Set toggle state
  setMatchModeUI(modalMatchMode);

  renderChapterOptions('');
  updateModalPreview();
}

function closeChapterModal() {
  var overlay = document.getElementById('chapterModal');
  if (overlay) overlay.classList.remove('active');
  pendingTodoIdx = -1;
  modalSelectedChapterIds = [];
  modalMatchMode = 'combined';
  modalSubjectFilter = '';
}

function renderChapterOptions(filter) {
  var list = document.getElementById('modalList');
  if (!list) return;
  var q = (filter || '').replace(/[\u201C\u201D\u300C\u300E（()）""''「」、，,.:：\s]/g, '').toLowerCase();

  var opts = [];
  CHAPTER_DATA.forEach(function(ch) {
    // No subject filter - show all subjects for cross-subject selection
    var name = (ch.name || '').replace(/[\u201C\u201D\u300C\u300E（()）""''「」、，,.:：\s]/g, '').toLowerCase();
    if (!q || name.indexOf(q) >= 0 || (ch.system || '').indexOf(q) >= 0 || (ch.subject || '').indexOf(q) >= 0) {
      opts.push(ch);
    }
  });

  if (opts.length === 0) {
    list.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--muted);text-align:center;">没有匹配章节</div>';
    return;
  }

  var html = '';
  opts.forEach(function(ch) {
    var isChecked = modalSelectedChapterIds.indexOf(ch.id) >= 0;
    var cls = 'tp-modal-opt' + (isChecked ? ' checked' : '');
    var subjColor = SUBJECT_COLORS[ch.subject] || '#b0a8a0';
    html += '<div class="' + cls + '" data-ch-id="' + ch.id + '">';
    html += '<div class="mc-check">' + (isChecked ? '\u2713' : '') + '</div>';
    html += '<span class="subj-tag" style="background:' + subjColor + '">' + ch.subject + '</span>';
    html += '<span>' + escapeHtml(ch.name) + '</span>';
    html += '<span style="font-size:10px;color:var(--muted);margin-left:auto;">' + ch.system + '</span>';
    html += '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.tp-modal-opt').forEach(function(el) {
    el.addEventListener('click', function() {
      var chId = parseInt(this.getAttribute('data-ch-id'), 10);
      if (chId) toggleChapterSelection(chId);
    });
  });
}

function filterChapterOptions() {
  var searchInput = document.getElementById('modalSearch');
  renderChapterOptions(searchInput ? searchInput.value : '');
}

function toggleChapterSelection(chId) {
  var idx = modalSelectedChapterIds.indexOf(chId);
  if (idx >= 0) {
    modalSelectedChapterIds.splice(idx, 1);
  } else {
    modalSelectedChapterIds.push(chId);
  }
  var searchInput = document.getElementById('modalSearch');
  renderChapterOptions(searchInput ? searchInput.value : '');
  updateModalPreview();
}

function updateModalPreview() {
  var previewEl = document.getElementById('modalPreview');
  var splitRowEl = document.getElementById('modalSplitRow');
  var countEl = document.getElementById('modalSelectedCount');
  var chipsEl = document.getElementById('modalPreviewChips');

  if (!previewEl || !splitRowEl) return;

  if (modalSelectedChapterIds.length === 0) {
    previewEl.style.display = 'none';
    splitRowEl.style.display = 'none';
    return;
  }

  previewEl.style.display = 'block';
  splitRowEl.style.display = 'flex';
  if (countEl) countEl.textContent = modalSelectedChapterIds.length;

  if (chipsEl) {
    var html = '';
    modalSelectedChapterIds.forEach(function(id) {
      var ch = getChapterById(id);
      if (!ch) return;
      var subjColor = SUBJECT_COLORS[ch.subject] || '#b0a8a0';
      html += '<span class="mc-chip">';
      html += '<span style="color:' + subjColor + ';font-size:8px;">' + ch.subject + '</span> ';
      html += escapeHtml(ch.name);
      html += ' <span class="mc-chip-x" onclick="removeSelectedChapter(' + id + ')">\u00d7</span>';
      html += '</span>';
    });
    chipsEl.innerHTML = html;
  }
}

function confirmChapterMatch() {
  if (pendingTodoIdx < 0 || !teacherTodoItems[pendingTodoIdx]) {
    closeChapterModal();

  if (modalSelectedChapterIds.length === 0) {
    alert('请至少选择一个章节');
    return;
  }

  var todo = teacherTodoItems[pendingTodoIdx];
  var chapters = modalSelectedChapterIds.map(function(id) {
    return getChapterById(id);
  }).filter(function(ch) { return ch; });

  if (chapters.length === 0) { closeChapterModal(); return; }

  // Set multi-chapter data
  todo.chapterIds = modalSelectedChapterIds.slice();
  todo.matchMode = modalMatchMode;
  // Keep chapterId for backward compatibility (first chapter)
  todo.chapterId = modalSelectedChapterIds[0];
  todo.matchInfo = { chapter: chapters[0], score: 100, matchField: 'manual' };
  todo.allMatches = chapters.map(function(ch) {
    return { chapter: ch, score: 100, matchField: 'manual' };

  closeChapterModal();
  renderTeacherTodoPanel();

}

function confirmMcSubCompletion() {
  if (!mcSubTaskId) return;
  var task = (store.customTasks || []).find(function(t) { return t.id === mcSubTaskId; });
  if (!task || !task.linkedChapterIds) { closeMcSubDialog(); return; }

  var todayStr = fmtDate(new Date());
  var allDone = mcSubCheckedIds.length === task.linkedChapterIds.length;
  var noneDone = mcSubCheckedIds.length === 0;

  // Initialize partialDone if not exists
  if (!task.partialDone) task.partialDone = {};

  // Update rollingStatus for each chapter
  task.linkedChapterIds.forEach(function(chId) {
    var shouldBeDone = mcSubCheckedIds.indexOf(chId) >= 0;
    var wasDone = task.partialDone[chId] || false;

    if (shouldBeDone && !wasDone) {
      // Mark as done
      if (!store.rollingStatus[chId]) {
        store.rollingStatus[chId] = { done: false, lastDate: '' };
      }
      store.rollingStatus[chId].done = true;
      store.rollingStatus[chId].lastDate = todayStr;
      if (!store.reviewRecords[chId]) {
        store.reviewRecords[chId] = { count: 0, lastDate: '', dates: [] };
      }
      store.reviewRecords[chId].count++;
      store.reviewRecords[chId].lastDate = todayStr;
      store.reviewRecords[chId].dates.push(todayStr);
      task.partialDone[chId] = true;
    } else if (!shouldBeDone && wasDone) {
      // Undo
      if (store.rollingStatus[chId]) {
        store.rollingStatus[chId].done = false;
      }
      task.partialDone[chId] = false;
    }
  });

  // Update task done state
  if (allDone) {
    task.done = true;
  } else if (noneDone) {
    task.done = false;
  } else {
    task.done = false; // Partial - keep visible but not fully done
  }

  task.lastModified = Date.now();
  saveStore();
  closeMcSubDialog();
  renderDailyPlan();
  renderHome();
  if (allDone) showTaskToast();
}

</script>

<!-- Chapter Selection Modal -->
<div class="tp-modal-overlay" id="chapterModal">
  <div class="tp-modal-box">
    <div class="tp-modal-title">选择匹配章节（可多选） <span id="modalSubjHint" style="font-size:11px;font-weight:400;color:var(--muted);"></span></div>
    <input class="tp-modal-search" id="modalSearch" placeholder="搜索章节名称..." oninput="filterChapterOptions()" />
    <div class="tp-modal-list" id="modalList"></div>
    <div class="tp-modal-preview" id="modalPreview" style="display:none;">
      <div class="tp-modal-preview-title">已选 <span id="modalSelectedCount">0</span> 个章节</div>
      <div class="tp-modal-preview-chips" id="modalPreviewChips"></div>
    </div>
    <div class="tp-modal-split-row" id="modalSplitRow" style="display:none;">
      <span>添加方式：</span>
      <div class="tp-modal-split-toggle">
        <div class="tp-modal-split-opt active" data-mode="combined" onclick="setMatchMode('combined')">合并为一条</div>
        <div class="tp-modal-split-opt" data-mode="separate" onclick="setMatchMode('separate')">分开添加</div>
      </div>
    </div>
    <div class="tp-modal-actions">
      <button class="tp-modal-btn" onclick="closeChapterModal()">取消</button>
      <button class="tp-modal-btn primary" onclick="confirmChapterMatch()">确认匹配</button>
    </div>
  </div>
</div>

<!-- Sub-completion dialog for combined multi-chapter tasks -->
<div class="mc-sub-overlay" id="mcSubOverlay">
  <div class="mc-sub-box">
    <div class="mc-sub-title" id="mcSubTitle">选择已完成的章节</div>
    <div class="mc-sub-list" id="mcSubList"></div>
    <div class="mc-sub-actions">
      <button class="mc-sub-btn" onclick="closeMcSubDialog()">取消</button>
      <button class="mc-sub-btn primary" onclick="confirmMcSubCompletion()">确认</button>
    </div>
  </div>
</div>
